sensor:
      - name: "Override Monitor"
        unique_id: gpe_override_monitor
        icon: mdi:shield-lock
        state: >-
          {% set target_areas = label_areas('override_eligible') %}
          


        attributes:
          eligible_areas: >-
            {{ label_areas('override_eligible') | list }}

          # Determines overridden areas based on the most recently changed entity
          override_areas: >-


            {% set areas = label_areas('override_eligible') %}
            {% set entities = areas | map('area_entities') | sum(start=[]) %}

            {% set candidates = entities
              | select('match', '^light\\.')
            %}

            {% set active = candidates 
              | unique 
              | expand 
              | selectattr('state', 'in', ['on', 'off', 'open', 'closed']) 
              | sort(attribute='last_changed') 
              | map(attribute='entity_id') | list %}

            {% if active | count > 0 %}
              {% set lead = active | last %}
              {{ lead }}@{{ states[lead].last_changed }}@{{ states[lead].state }}
            {% else %}
              none
            {% endif %}