- id: '1784528172900'
  alias: GPE - Stateful Batching Janitor (V3.2)
  description: '# GPE - STATEFUL BATCHING JANITOR (V3.2.0)

    Domain-aware eviction engine. Sweeps expired intent tokens across all active  planes
    (lighting, ventilation, climate) and dispatches domain-appropriate cleanup events.

    '
  triggers:
  - trigger: event
    event_type: presence_state_update
  actions:
  - delay:
      milliseconds: 20
  - variables:
      areas_init: '{{ state_attr(''sensor.presence_state_registry'', ''active_areas'')
        or {} }}'
      exp_times: "{% set ns = namespace(times=[]) %} {% for entity_key, data in areas_init.items()
        %}\n  {% if data.expiry is defined and data.expiry is not none %}\n    {%
        set ns.times = ns.times + [data.expiry] %}\n  {% endif %}\n{% endfor %}  {{
        ns.times | sort }}"
      next_target: '{{ exp_times | first | default(''None (Overrides Active)'') }}'
  - repeat:
      while:
      - condition: template
        value_template: '{{ (state_attr(''sensor.presence_state_registry'', ''active_areas'')
          or {}) | length > 0 }}'
      sequence:
      - variables:
          areas: '{{ state_attr(''sensor.presence_state_registry'', ''active_areas'')
            or {} }}'
          now_ts: '{{ as_timestamp(now()) }}'
          sweep_limit: '{{ now_ts + 10.0 }}'
          expired_batch: "{% set ns = namespace(items=[]) %} {% for entity_key, data
            in areas.items() %}\n  {% if data.expiry is defined and data.expiry is
            not none and data.expiry <= sweep_limit %}\n    {# Support both legacy
            'area' key and new composite 'area_id:domain' structure #}\n    {% set
            area_id = data.area_id | default(entity_key) %}\n    {% set domain = data.domain
            | default('lighting') %}\n    {% set ns.items = ns.items + [{'entity_key':
            entity_key, 'area_id': area_id, 'domain': domain, 'data': data}] %}\n
            \ {% endif %}\n{% endfor %}  {{ ns.items }}"
          next_survivor_expiry: "{% set ns = namespace(times=[]) %} {% for entity_key,
            data in areas.items() %}\n  {% if data.expiry is defined and data.expiry
            is not none and data.expiry > sweep_limit %}\n    {% set ns.times = ns.times
            + [data.expiry] %}\n  {% endif %}\n{% endfor %}  {{ ns.times | sort |
            first | default(none) }}"
          sleep_duration: "{% if next_survivor_expiry is not none %}\n  {% set target_sleep
            = (next_survivor_expiry - sweep_limit) %}\n  {{ target_sleep if target_sleep
            > 0 else 0.1 }}\n{% else %}\n  {{ 3600.0 if areas | length > 0 else 0
            }}\n{% endif %}"
      - alias: Process Expired Batches
        if:
        - condition: template
          value_template: '{{ expired_batch | length > 0 }}'
        then:
        - repeat:
            for_each: '{{ expired_batch }}'
            sequence:
            - variables:
                item_area: '{{ repeat.item.area_id }}'
                item_domain: '{{ repeat.item.domain }}'
                item_data: '{{ repeat.item.data }}'
                profile_sensor: sensor.{{ repeat.item.area_id }}_profile
                registry_sensor: sensor.{{ repeat.item.area_id }}_presence_intent
                profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
                  }}'
                profile_topography: '{{ state_attr(profile_sensor, ''topography'')
                  | default({}, true) if profile_exists else {} }}'
                profile_policy_map: '{{ state_attr(profile_sensor, ''policy_map'')
                  | default({}, true) if profile_exists else {} }}'
                profile_features: '{{ state_attr(profile_sensor, ''features'') | default({},
                  true) if profile_exists else {} }}'
                door_entities: '{{ profile_topography.get(''door_entities'', []) }}'
                door_entity: '{{ door_entities | first | default(''none'') }}'
                has_door: '{{ door_entity != ''none'' and states(door_entity) not
                  in [''unknown'', ''unavailable''] }}'
                is_door_closed: '{{ is_state(door_entity, ''off'') if has_door else
                  false }}'
                door_age: '{{ (as_timestamp(now()) - as_timestamp(states[door_entity].last_changed,
                  0)) | int if has_door else 0 }}'
                current_posture: '{% set registry = state_attr(''sensor.global_variable_registry'',
                  ''vars'') | default({}, true) %} {% set g_env = registry.get(''globals'',
                  {}).get(''environmental'', {}) %} {{ states(g_env.get(''schedule_posture'',''''))
                  | default(''daylight'', true) }}'
                profile_posture: '{{ profile_policy_map.get(current_posture, ''none'')
                  }}'
                use_scene: '{{ profile_features.get(''scene_eligible'', true) }}'
                use_night_settings: '{% set registry = state_attr(''sensor.global_variable_registry'',
                  ''vars'') | default({}, true) %} {% set g_env = registry.get(''globals'',
                  {}).get(''environmental'', {}) %} {{ profile_features.get(''night_light'',
                  false) and is_state(g_env.get(''night_posture_sensor'', ''''), ''on'')
                  }}'
                final_target_label: '{{ [''night_light''] if use_night_settings else
                  [''main''] }}'
                current_stack: "{% set dom_block = state_attr(registry_sensor, 'lighting')
                  %} {% set root_stack = state_attr(registry_sensor, 'intent_stack')
                  %} {% if dom_block is mapping and 'intent_stack' in dom_block %}\n
                  \ {{ dom_block.get('intent_stack', []) }}\n{% elif root_stack is
                  sequence %}\n  {{ root_stack }}\n{% else %}\n  {{ [] }}\n{% endif
                  %}"
                locked_intent: '{% set stack = (current_stack | from_json) if current_stack
                  is string else current_stack %} {{ stack | selectattr(''locked'',
                  ''eq'', true) | first | default(none) }}'
                is_area_locked: '{{ locked_intent is not none }}'
                area_context:
                  area_id: '{{ item_area }}'
                  posture: '{{ current_posture }}'
                  profile_posture: '{{ profile_posture }}'
                  final_label: '{{ final_target_label }}'
                  is_door_closed: '{{ is_door_closed }}'
                  door_age: '{{ door_age }}'
                  is_locked: '{{ is_area_locked }}'
                  use_scene: '{{ use_scene }}'
                  profile_features: '{{ profile_features }}'
                  profile_topography: '{{ profile_topography }}'
            - event: presence_state_update
              event_data:
                area_id: '{{ item_area }}'
                domain: '{{ item_domain }}'
                state: EVICTED
                last_claimant: batch_janitor_engine
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ item_domain == ''lighting'' }}'
                sequence:
                - event: universal_controller_command
                  event_data:
                    source_device: gpe_janitor
                    action_type: light_call
                    command_input: turn_off
                    target:
                      area_id: '{{ item_area }}'
                    metadata:
                      publish_intent: remove
                      claimant_id: '{{ item_data.get(''last_claimant'', '''') }}'
                      seconds: 0
                      intent_type: '{{ item_data.get(''last_intent_type'', ''motion'')
                        }}'
                      domain: lighting
                    area_context: '{{ area_context }}'
                alias: Lighting
              - conditions:
                - condition: template
                  value_template: '{{ item_domain == ''ventilation'' }}'
                sequence:
                - action: fan.turn_off
                  metadata: {}
                  target:
                    area_id: '{{ item_area }}'
                  data: {}
                - event: area_registry_update
                  event_data:
                    source_device: gpe_janitor
                    action: remove
                    claimant_id: '{{ item_data.get(''last_claimant'', '''') }}'
                    domain: ventilation
                    target:
                      area_id: '{{ item_area }}'
                    intent_type: motion
                    seconds: 0
                - action: logbook.log
                  metadata: {}
                  data:
                    name: Janitor Fan Turn Off
                    message: Janitor Turn Off Fan {{ item_area }}
                    entity_id: '{{ item_data.last_claimant }}'
                alias: Ventilation
              default:
              - event: universal_controller_command
                event_data:
                  source_device: gpe_janitor
                  action_type: area_registry_update
                  action: remove
                  target:
                    area_id: '{{ item_area }}'
                  claimant_id: '{{ item_data.get(''last_claimant'', '''') }}'
                  domain: '{{ item_domain }}'
      - if:
        - condition: template
          value_template: '{{ sleep_duration | float > 0 }}'
        then:
        - delay: '{{ sleep_duration | float }}'
        alias: Sleep Process Between Iterations
  mode: restart
  trace:
    stored_traces: 50
- id: '1784529058460'
  alias: GPE - Orchestrator (V8.1)
  description: "# GPE - ORCHESTRATOR (V8.1) \nDecision engine for environmental presence.
    V3.2 Domain-Aware Architecture.\n## 1. CORE PURPOSE\nActs as the central decision
    engine for environmental presence. Fully  integrated with the Priority Intent
    Stack (Registry V3.2 Hoisted Domains).\n## 2. ARCHITECTURAL LOGIC\n* **Priority
    Intent Integration**: All presence events are tagged with \n  `intent_type: motion`
    and `domain: lighting` to ensure they interact \n  correctly with multi-layered
    domain stacks.\n  \n* **Standardized Handshake**: Uses `claimant_id` as the primary
    identifier \n  to align with Registry V3.2 standards.\n  \n* **The Handover Pattern**:
    When high-precision presence clears, the system \n  automatically hands over to
    a 120s motion-type timer instead of immediate \n  removal, preventing jarring
    light cut-offs.\n\n* **The Gatekeeper Pattern**: Suppresses redundant commands
    if the room \n  is already in the desired state and filters false-positives via
    \n  Ghost/Veto logic.\n\nDecision engine for environmental presence.\n* **Priority
    Intent Integration**: All presence events are tagged with \n  `intent_type: motion`
    to ensure they interact correctly with the \n  multi-layered priority stack.\n
    \ \n* **Standardized Handshake**: Uses `claimant_id` as the primary identifier
    \n  to align with Registry v6.1 and Cleaner v2.1 standards.\n  \n* **The Handover
    Pattern**: When high-precision presence clears, the system \n  automatically hands
    over to a 120s motion-type timer instead of immediate \n  removal, preventing
    jarring light cut-offs.\n\n* **The Gatekeeper Pattern**: Suppresses redundant
    commands if the room \n  is already in the desired state and filters false-positives
    via \n  Ghost/Veto logic.\n\n## 3. VERSION HISTORY\n* **V6.0**: Implemented area
    specific registers for static and configuration items\n* **V5.0**: Implemented
    'Purpose-specific triggers' and 'Label-based targets'  Added the MQTT trigger
    to allow for Reolink person sensors to be triggers without having the Reolink
    integration installed.\n* **V3.0**: Implemented schduled lighting via lighting
    schedule template sensor.\n* **V2.4**: Implemented conditional 'seconds' (30s
    for door-only transitions).\n* **V2.3.5**: Fixed Safety Unlock to use explicit
    'add' for grace period.\n* **V2.3.3**: Hardened Presence Update/Cleared aliases
    to strictly ignore \n  locked areas. Prevents motion-off events from overwriting
    infinite locks.\n\n* **V2.3.2**: Refined Valid Turn On to ignore door events if
    area is locked.\n  Prevents race conditions between Portal Turn On and Safety
    Unlock.\n\n* **V2.3.1**: Relaxed door_age restriction in should_lock_area. \n
    \ Allows locking if motion is sustained while the door is closed, \n  even if
    the door closure was >120s ago.\n\n* **V2.3**: Removed 'Presence Off' from should_unlock_area
    to prevent \n  premature unlocking when motion clears in locked zones.\n  \n*
    **V2.2**: Fix Modified should_unlock_area to transition to a 30s grace period
    instead  of immediate removal to prevent instant blackouts when doors open.\n*
    **V2.1**: Standardized on `claimant_id`. Implemented 120s \"Handover\" logic for
    cleared presence. Restored missing Door Timer and Motion Reset logic. \n* **V2.0**:
    Implemented Multi-Tenant Ownership tracking. Standardized event \n  schema for
    Registry v5.7 compatibility.\n  \n* **V1.5**: Updated attribute paths to `active_intents`.
    Standardized \n  `intent_type` as 'motion' for all presence-based additions."
  triggers:
  - trigger: motion.cleared
    target:
      label_id: presence
    options:
      behavior: each
      for:
        hours: 0
        minutes: 0
        seconds: 10
  - trigger: motion.detected
    target:
      label_id: presence
    options:
      behavior: each
  - trigger: occupancy.cleared
    target:
      label_id: presence
    options:
      behavior: each
  - trigger: occupancy.detected
    target:
      label_id: presence
    options:
      behavior: each
  - trigger: door.closed
    target:
      label_id: door
    options:
      behavior: each
      for:
        hours: 0
        minutes: 0
        seconds: 5
  - trigger: door.opened
    target:
      label_id: door
    options:
      behavior: each
  - trigger: mqtt
    options:
      topic: home/sensor/+/person
    id: Broadcast
    enabled: false
  conditions: []
  actions:
  - variables:
      source_entity: "{% if trigger.id == 'Broadcast' %}\n  {{ trigger.payload_json.target.entity_id
        | default('none') }}\n{% else %}\n  {{ trigger.entity_id | default('none')
        }}\n{% endif %}\n"
      target_area: "{% if trigger.id == 'Broadcast' %}\n  {{ trigger.payload_json.target.area_id
        | default('none') }}\n{% else %}\n  {{ area_id(source_entity) | default('none')
        }}\n{% endif %}"
      entity_labels: "{% if trigger.id == 'Broadcast' %}\n  {{ trigger.payload_json.target.label_id
        | default([]) }}\n{% else %}\n  {{ labels(source_entity) | default([]) }}\n{%
        endif %}"
      profile_sensor: sensor.{{ target_area }}_profile
      profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
        }}'
      profile_topography: '{{ state_attr(profile_sensor, ''topography'') | default({},
        true) }}'
      profile_policy_map: '{{ state_attr(profile_sensor, ''policy_map'') | default({},
        true) }}'
      profile_features: '{{ state_attr(profile_sensor, ''features'') | default({},
        true) }}'
      door_entities: '{{ profile_topography.get(''door_entities'', []) }}'
      presence_entities: '{{ profile_topography.get(''presence_entities'', []) }}'
      fan_entities: '{{ profile_topography.get(''fan_entities'', []) }}'
      door_entity: '{{ door_entities | first | default(''none'') }}'
      has_door: '{{ door_entity != ''none'' and states(door_entity) not in [''unknown'',
        ''unavailable''] }}'
      presence_entity: '{{ presence_entities | first | default(''none'') }}'
      fan_entity: '{{ fan_entities | first | default(''none'') }}'
      has_presence: '{{ presence_entity != ''none'' }}'
      has_fan: '{{ fan_entity != ''none'' }}'
      door_state: '{{ states(door_entity) if has_door else ''none'' }}'
      is_door_closed: '{{ is_state(door_entity, ''off'') if has_door else false }}'
      door_age: '{{ as_timestamp(now()) - as_timestamp(states[door_entity].last_changed,
        0) if has_door else 0 }}'
      current_posture: '{% set registry = state_attr(''sensor.global_variable_registry'',
        ''vars'') | default({}, true) %} {% set g_env = registry.get(''globals'',
        {}).get(''environmental'', {}) %} {{ states(g_env.get(''schedule_posture'',''''))
        | default(''daylight'', true) }}'
      profile_posture: "{% set backstop = profile_policy_map.get(current_posture,
        'none') %} {% set sub_zones_data = state_attr(profile_sensor, 'sub_zones')
        | default({}, true) %} {% set matched_zone = entity_labels | select('in',
        sub_zones_data.keys()) | first | default(none) %} {% if matched_zone is not
        none %}\n  {% set zone_policy = sub_zones_data[matched_zone].get('policy_map',
        {}).get(current_posture, 'none') %}\n  {{ backstop if zone_policy == 'none'
        else zone_policy }}\n{% else %}\n  {{ backstop }}\n{% endif %}"
      is_on: '{{ is_state(source_entity, ''on'') }}'
      is_presence: '{{ ''presence'' in entity_labels or ''person'' in entity_labels
        or source_entity in presence_entities }}'
      is_presence_policy_active: '{{ (profile_posture == ''presence'' or profile_posture
        == ''on'') }}'
      is_door: '{{ ''door'' in entity_labels or source_entity in door_entities }}'
      is_entrance: '{{ ''entrance'' in entity_labels }}'
      use_scene: '{{ profile_features.get(''scene_eligible'', true) }}'
      target_select: select.{{ target_area }}_matrix_scene
      current_history: '{{ state_attr(target_select, ''history_stack'') | default([],
        true) }}'
      current_scene: '{{ state_attr(target_select, ''scene'') | default({}, true)
        }}'
      is_lock_zone: '{{ profile_features.get(''lock_eligible'', false) }}'
      use_night_settings: '{% set registry = state_attr(''sensor.global_variable_registry'',
        ''vars'') | default({}, true) %} {% set g_env = registry.get(''globals'',
        {}).get(''environmental'', {}) %} {{ profile_features.get(''night_light'',
        false) and is_state(g_env.night_posture_sensor, ''on'') }}

        '
      final_target_label: "{% if use_night_settings %} \n  {{ ['night_light'] }} \n{%
        else %}\n  {% set sub_zones_data = state_attr(profile_sensor, 'sub_zones')
        | default({}, true) %}\n  {% set matched_zone = entity_labels | select('in',
        sub_zones_data.keys()) | first | default(none) %}\n  {% if matched_zone is
        not none %}\n    {{ [matched_zone] }}\n  {% else %}\n    {{ ['main'] }}\n
        \ {% endif %}\n{% endif %}"
      adjoining_area: '{{ profile_topography.get(''peer_area'', ''none'') }}'
      local_registry: sensor.{{ target_area }}_presence_intent
      current_stack: "{% set dom_block = state_attr(local_registry, 'lighting') %}\n{%
        set root_stack = state_attr(local_registry, 'intent_stack') %}\n{% if dom_block
        is mapping and 'intent_stack' in dom_block %}\n  {{ dom_block.get('intent_stack',
        []) }}\n{% elif root_stack is sequence %}\n  {{ root_stack }}\n{% else %}\n
        \ {{ [] }}\n{% endif %}"
      locked_intent: '{{ (current_stack | from_json) | selectattr(''locked'', ''eq'',
        true) | first | default(none) if current_stack is string else current_stack
        | selectattr(''locked'', ''eq'', true) | first | default(none) }}'
      is_area_locked: '{{ locked_intent is not none }}'
      locked_claimant_id: '{{ locked_intent.claimant_id if is_area_locked else ''none''
        }}'
      area_context:
        area_id: '{{ target_area }}'
        posture: '{{ current_posture }}'
        profile_posture: '{{ profile_posture }}'
        final_label: '{{ final_target_label }}'
        is_door_closed: '{{ is_door_closed }}'
        door_age: '{{ door_age | int }}'
        is_locked: '{{ is_area_locked }}'
        use_scene: '{{ use_scene }}'
        profile_features: '{{ profile_features }}'
        profile_topography: '{{ profile_topography }}'
      hvac_action: '{% set registry = state_attr(''sensor.global_variable_registry'',
        ''vars'') | default({}, true) %} {% set g_hvac = registry.get(''globals'',
        {}).get(''hvac'', {}) %} {{ state_attr(g_hvac.get(''primary_unit'',''climate.my_ecobee''),
        ''hvac_action'') | default(''idle'') }}'
      hvac_is_active: '{{ hvac_action in [''heating''] }}'
      is_ghost: '{{ has_door and is_presence and is_on and is_door_closed and not
        is_area_locked and (door_age > 600 or hvac_is_active) and is_lock_zone }}'
      should_lock_area: "{% set active_stack = (current_stack | from_json) if current_stack
        is string else current_stack %}\n{{ \n  is_lock_zone and \n  is_presence and
        \n  is_on and \n  is_door_closed and \n  not is_area_locked and \n  (door_age
        < 120 or (active_stack | selectattr('type', 'eq', 'motion') | list | count
        > 0)) \n}}"
      should_unlock_area: '{{ is_area_locked and ((is_door and is_on) or (has_door
        and not is_door_closed and door_age < 5)) }}'
      should_trigger_peer: '{{ is_door and is_on and target_area != ''none'' and adjoining_area
        != ''none'' }}'
  - variables:
      target_select: select.{{ target_area }}_matrix_scene
      raw_scene: '{{ states(target_select) }}'
      is_room_off: '{% set s = raw_scene %} {{ s is defined and (s == ''0'' or s.startswith(''0:''))
        }}

        '
      call_scene: '{{ is_room_off and is_presence_policy_active and is_on and use_scene
        }}'
      call_off_scene: '{{ not is_room_off and is_presence_policy_active and not is_on
        and use_scene }}'
  - choose:
    - alias: Veto Log (Ghost Detected)
      conditions:
      - condition: template
        value_template: '{{ is_presence and is_on and is_ghost }}'
      sequence:
      - action: logbook.log
        data:
          name: GPE VETO
          message: 'GPE VETO: Ghost in {{ target_area }} (HVAC: {{ hvac_action }},
            Door Age: {{ door_age | int }}s, Lock Status: {{ is_area_locked}})'
          entity_id: '{{ source_entity }}'
    - alias: Lock Presence (Sabbatical)
      conditions:
      - condition: template
        value_template: '{{ should_lock_area and not is_area_locked }}'
      sequence:
      - event: area_registry_update
        event_data:
          action: lock
          claimant_id: '{{ door_entity }}'
          domain: lighting
          target:
            area_id: '{{ target_area }}'
          intent_type: motion
          area_context: '{{ area_context }}'
        enabled: false
      - if:
        - condition: template
          value_template: '{{ not use_scene }}'
        then:
        - event: universal_controller_command
          event_data:
            action_type: light_call
            command_input: turn_on
            target:
              area_id: '{{ target_area }}'
              label_id: '{{ final_target_label }}'
            action_value: '{{ ''night_mode'' if use_night_settings else ''day_mode''
              }}'
            metadata:
              action: lock
              claimant_id: '{{ door_entity }}'
              intent_type: motion
              domain: lighting
            area_context: '{{ area_context }}'
            source_device: '{{ source_entity }}'
        else:
        - event: area_registry_update
          event_data:
            action: lock
            claimant_id: '{{ door_entity }}'
            domain: lighting
            target:
              area_id: '{{ target_area }}'
              label_id: '{{ final_target_label }}'
            intent_type: motion
            area_context: '{{ area_context }}'
            source_device: '{{ source_entity }}'
        - event: universal_controller_command
          event_data:
            action_type: scene_cycle
            target:
              area_id: '{{ target_area }}'
            action_value: restore
            metadata:
              publish_intent: lock
              claimant_id: '{{ source_entity }}'
              intent_type: motion
              domain: lighting
            area_context: '{{ area_context }}'
            source_device: '{{ source_entity }}'
          enabled: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ has_fan }}'
          sequence:
          - action: fan.turn_on
            metadata: {}
            target:
              entity_id: '{{ fan_entities }}'
            data: {}
          - event: area_registry_update
            event_data:
              action: lock
              claimant_id: '{{ door_entity }}'
              domain: ventilation
              target:
                area_id: '{{ target_area }}'
              intent_type: motion
              area_context: '{{ area_context }}'
            enabled: true
          alias: Has Fan
      - action: logbook.log
        data:
          name: GPE LOCKED
          message: 'LOCKED: {{ target_area }} via {{ source_entity }}. (Door Age:
            {{ door_age | int }}s, Presence: {{ is_on }})'
          entity_id: '{{ source_entity }}'
    - alias: Valid Turn On (Anti-Ghosting)
      conditions:
      - condition: template
        value_template: '{{ (is_entrance or is_door or is_presence) and is_presence_policy_active
          and is_on and not is_ghost and not is_area_locked }}'
      sequence:
      - action: logbook.log
        data:
          name: GPE
          message: 'Turn On: Via {{''Motion'' if is_presence else ''Portal'' }} Room
            {{ target_area }} (Registry Reset, Door Age: {{ door_age | int }}s)'
          entity_id: '{{ source_entity }}'
      - alias: Turn On Lighting
        if:
        - condition: template
          value_template: '{{ not use_scene }}'
        then:
        - event: universal_controller_command
          event_data:
            action_type: light_call
            command_input: turn_on
            target:
              area_id: '{{ target_area }}'
              label_id: '{{ final_target_label }}'
            action_value: '{{ ''night_mode'' if use_night_settings else ''day_mode''
              }}'
            metadata:
              publish_intent: add
              claimant_id: '{{ source_entity }}'
              seconds: '{{ 30 if is_door and has_presence else -1 }}'
              intent_type: motion
              domain: lighting
            area_context: '{{ area_context }}'
            source_device: '{{ source_entity }}'
        else:
        - event: area_registry_update
          event_data:
            action: '{{ ''remove'' if is_presence else ''add'' }}'
            claimant_id: '{{ source_entity }}'
            domain: lighting
            target:
              area_id: '{{ target_area }}'
              label_id: '{{ final_target_label }}'
            intent_type: motion
            area_context: '{{ area_context }}'
            seconds: '{{ 0 if is_presence else 30 }}'
            skip_warning: true
        - if:
          - condition: template
            value_template: '{{ current_scene.scene_id == 0 }}'
          then:
          - event: universal_controller_command
            event_data:
              action_type: scene_cycle
              target:
                area_id: '{{ target_area }}'
              action_value: restore
              metadata:
                publish_intent: remove
                claimant_id: '{{ source_entity }}'
                intent_type: motion
                domain: lighting
              area_context: '{{ area_context }}'
              source_device: '{{ source_entity }}'
      - alias: Additional Domains
        choose:
        - conditions:
          - condition: template
            value_template: '{{ has_fan }}'
          sequence:
          - action: fan.turn_on
            metadata: {}
            target:
              entity_id: '{{ fan_entities }}'
            data: {}
          - event: area_registry_update
            event_data:
              action: '{{ ''remove'' if is_presence else ''add'' }}'
              claimant_id: '{{ source_entity }}'
              domain: ventilation
              target:
                area_id: '{{ target_area }}'
              intent_type: motion
              area_context: '{{ area_context }}'
              seconds: '{{ 0 if is_presence else 30 }}'
            enabled: true
          alias: Has Fan
    - alias: Presence Cleared (Handover)
      conditions:
      - condition: template
        value_template: '{{ is_presence and not is_on and not is_area_locked }}'
      sequence:
      - alias: Lighting Set Turn Off
        choose:
        - alias: Start Expiry Timer (120s)
          conditions:
          - condition: template
            value_template: '{{ not use_scene }}'
          sequence:
          - event: area_registry_update
            event_data:
              action: add
              claimant_id: '{{ source_entity }}'
              domain: lighting
              target:
                area_id: '{{ target_area }}'
                label_id: '{{ final_target_label }}'
              intent_type: motion
              seconds: 110
              area_context: '{{ area_context }}'
          - action: logbook.log
            data:
              name: GPE
              message: 'Cleared: Via {{''Motion'' if is_presence else ''Portal'' }}
                Room {{ target_area }} (Registry Reset, Door Age: {{ door_age | int
                }}s)'
              entity_id: '{{ source_entity }}'
        - alias: Call Off Scene
          conditions:
          - condition: template
            value_template: '{{ call_off_scene }}'
          sequence:
          - event: area_registry_update
            event_data:
              action: add
              claimant_id: '{{ source_entity }}'
              domain: lighting
              target:
                area_id: '{{ target_area }}'
                label_id: '{{ final_target_label }}'
              intent_type: motion
              skip_warning: true
              seconds: 240
              area_context: '{{ area_context }}'
          - action: logbook.log
            data:
              name: GPE
              message: 'Cleared: Via {{''Motion'' if is_presence else ''Portal'' }}
                Room {{ target_area }} (Registry Reset, Door Age: {{ door_age | int
                }}s)'
              entity_id: '{{ source_entity }}'
      - alias: Additional Domains
        choose:
        - conditions:
          - condition: template
            value_template: '{{ has_fan }}'
          sequence:
          - event: area_registry_update
            event_data:
              action: add
              claimant_id: '{{ source_entity }}'
              domain: ventilation
              target:
                area_id: '{{ target_area }}'
              intent_type: motion
              area_context: '{{ area_context }}'
              seconds: 290
            enabled: true
          alias: Has Fan
    - alias: Door Closed Timer Reset
      conditions:
      - condition: template
        value_template: '{{ is_door and not is_on }}'
      sequence:
      - event: area_registry_update
        event_data:
          action: add
          claimant_id: '{{ source_entity }}'
          domain: lighting
          target:
            area_id: '{{ target_area }}'
            label_id: '{{ final_target_label }}'
          intent_type: motion
          seconds: 30
          skip_warning: '{{ not is_lock_zone }}'
          area_context: '{{ area_context }}'
    - alias: Presence Update (Motion Reset)
      conditions:
      - condition: template
        value_template: '{{ is_presence and is_on and is_presence_policy_active and
          not is_area_locked and (not has_door or not is_door_closed) }}'
      sequence:
      - event: area_registry_update
        event_data:
          action: add
          claimant_id: '{{ source_entity }}'
          domain: lighting
          target:
            area_id: '{{ target_area }}'
            label_id: '{{ final_target_label }}'
          intent_type: motion
          seconds: 120
          area_context: '{{ area_context }}'
      - alias: Additional Domains
        choose:
        - conditions:
          - condition: template
            value_template: '{{ has_fan }}'
          sequence:
          - event: area_registry_update
            event_data:
              action: add
              claimant_id: '{{ source_entity }}'
              domain: ventilation
              target:
                area_id: '{{ target_area }}'
              intent_type: motion
              area_context: '{{ area_context }}'
              seconds: 290
            enabled: true
          alias: Has Fan
    - alias: Safety Unlock (Grace Period)
      conditions:
      - condition: template
        value_template: '{{ should_unlock_area }}'
      sequence:
      - action: logbook.log
        data:
          name: GPE UNLOCK
          message: 'UNLOCKING: {{ target_area }} (Handover to 30s Grace). (Reason:
            Door Opened/Ajar)'
          entity_id: '{{ source_entity }}'
      - event: area_registry_update
        event_data:
          action: add
          claimant_id: '{{ locked_claimant_id }}'
          domain: lighting
          target:
            area_id: '{{ target_area }}'
            label_id: '{{ final_target_label }}'
          intent_type: motion
          seconds: 30
          locked: false
          area_context: '{{ area_context }}'
      - event: area_registry_update
        event_data:
          action: purge
          claimant_id: '{{ locked_claimant_id }}'
          domain: lighting
          target:
            area_id: '{{ target_area }}'
            label_id: '{{ final_target_label }}'
          intent_type: motion
          seconds: 0
          area_context: '{{ area_context }}'
        enabled: false
      - alias: Additional Domains
        choose:
        - conditions:
          - condition: template
            value_template: '{{ has_fan }}'
          sequence:
          - event: area_registry_update
            event_data:
              action: add
              claimant_id: '{{ locked_claimant_id }}'
              domain: ventilation
              target:
                area_id: '{{ target_area }}'
              intent_type: motion
              area_context: '{{ area_context }}'
              seconds: 110
              locked: false
            enabled: true
          alias: Has Fan
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 50
        enabled: false
    enabled: true
    default:
    - action: logbook.log
      data:
        name: GPE
        message: 'Dropped: {{''Motion'' if is_presence else ''Portal'' }} in {{ area_name(target_area)
          }} (Door Age: {{ door_age | int }}s)'
        entity_id: '{{ source_entity }}'
  - if:
    - condition: template
      value_template: '{{ should_trigger_peer }}'
    then:
    - event: universal_controller_command
      event_data:
        action_type: light_call
        command_input: turn_on
        target:
          area_id: '{{ adjoining_area }}'
          label_id: '{{ final_target_label }}'
        action_value: ''
        metadata:
          publish_intent: skip
          domain: lighting
        area_context: '{{ area_context }}'
    enabled: true
  mode: parallel
  variables: {}
  max: 50
  trace:
    stored_traces: 50
- id: '1784571070062'
  alias: GPE - Intent Distributor (V3.5.0)
  description: "# GPE - INTENT DISTRIBUTOR (V3.5.0)\n\n## 1. ARCHITECTURAL CORE\n\nManages
    Hoisted Multi-Domain Area Intent Registries. Reads synchronous native \nmemory
    cache from sensor.presence_state_registry (active_intent_stacks), \ncalculates
    multi-weighted stack priorities, mutates domain stacks, dispatches \nbus events,
    and broadcasts MQTT discovery payloads.\n\n## 2. VERSION LOGIC (v3.5.0)\n\n* **Native
    RAM Cache**: Eliminates MQTT race conditions by reading directly\nfrom \n  sensor.presence_state_registry's
    active_intent_stacks attribute.\n* **Hoisted Domains**: Stack arrays and expiry
    calculations are isolated\nunder \n  top-level domain attributes (lighting, ventilation,
    climate).\n* **Queued Execution**: Replaces parallel execution with queued mode
    to\nguarantee \n  sequential order during rapid-fire events.\n\n## 3. PRIORITY
    LEVELS\n\n* **Priority 3**: Schedules (Highest persistence).\n\n* **Priority 2**:
    Manual Overrides (User intervention).\n\n* **Priority 1**: Motion/Automation (Standard
    logic).\n"
  triggers:
  - trigger: event
    event_type: area_registry_update
  - trigger: event
    event_type: lighting_registry_update
  - trigger: event
    event_type: esphome.area_registry_update
  - trigger: event
    event_type: esphome.lighting_registry_update
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: area_registry_update
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: lighting_registry_update
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: light_override
  - trigger: mqtt
    id: MQTT_Bus
    options:
      topic: home/universal/bus
      payload: area_registry_update
      value_template: '{{ value_json.action_type }}'
  actions:
  - parallel:
    - alias: Rate Limited Heartbeat Sync
      sequence:
      - condition: template
        alias: 'Fail-Fast: Rate limit execution to once every 20 seconds'
        value_template: "{% set last = this.attributes.last_triggered %} {{ last is
          none or (now() - last).total_seconds() > 20 }}\n                "
      - variables:
          active_intent_count: "{% set registries = label_entities('lights_off') |
            expand %}\n{% set ns = namespace(count=0) %}\n{% for r in registries %}\n
            \ {% set l_block = r.attributes.get('lighting', {}) %}\n  {% set stack
            = l_block.get('intent_stack', []) %}\n  {% if stack | selectattr('expiry',
            'defined') \n             | rejectattr('expiry', 'in', [none, '']) \n
            \            | rejectattr('locked', 'eq', true)\n             | list |
            count > 0 %}\n    {% set ns.count = ns.count + 1 %}\n  {% endif %}\n{%
            endfor %}\n{{ ns.count }}"
      - event: gpe_heartbeat_sync
        event_data:
          active_intent_count: '{{ active_intent_count }}'
          reason: '{{ ''registry_distribution_complete'' if active_intent_count ==
            0 else ''intent_updated'' }}

            '
    - alias: Main Process Block
      sequence:
      - delay:
          milliseconds: 20
        enabled: false
      - variables:
          p: '{{ (trigger.payload | from_json) if trigger.platform == ''mqtt'' else
            trigger.event.data }}'
          target_area: '{% set t = p.get(''target'', {}) %}  {{ t.get(''area_id'',
            p.get(''area_key'', p.get(''target_area'',''none''))) }}'
          val: "{% set t = p.get('target', {}) %} \n{{ t.get('label_id') | default(p.get('target_label'),
            true) }}"
          target_labels: '{{ ( [val] if val is string else val) }}

            '
          domain: '{{ p.get(''domain'', ''lighting'') | string }}'
          action_type: '{{ p.action_type | default(''area_registry_update'') }}'
          is_valid_mqtt: '{{ trigger.platform != ''mqtt'' or action_type in [''area_registry_update'',
            ''lighting_registry_update'', ''light_override''] }}'
      - condition: template
        value_template: '{{ is_valid_mqtt and target_area is not none and target_area
          != ''none'' }}'
      - variables:
          action: '{{ p.action | default(''add'') }}'
          cid: '{{ p.claimant_id | default(''system'') | string }}'
          intent_type: '{{ p.intent_type | default(''motion'') | string }}'
          all_stacks: '{{ state_attr(''sensor.presence_state_registry'', ''active_intent_stacks'')
            or {} }}'
          area_entry: '{{ all_stacks.get(target_area, {}) }}'
          domain_entry: '{{ area_entry.get(domain, {}) if area_entry is mapping else
            {} }}'
          raw_stack: '{{ domain_entry.get(''intent_stack'', []) if domain_entry is
            mapping else [] }}'
          current_stack: "{% set ns = namespace(cleaned=[]) %}   {% for item in raw_stack
            %}\n  {% set c_id = item.get('claimant_id') %}\n  {% set exp = item.get('expiry')
            %}\n  {% set is_expired = (exp is not none and exp != 'none' and exp |
            string != '' and as_timestamp(exp) < as_timestamp(now())) %}\n  \n  {#
            Retain token if it has a valid claimant_id and is active or locked #}\n
            \ {% if c_id is not none and (not is_expired or item.get('locked', false)
            or exp is none) %}\n    {% set ns.cleaned = ns.cleaned + [item] %}\n  {%
            endif %}\n{% endfor %}  \n{{ ns.cleaned  }}"
      - choose:
        - alias: Add, Lock, Override
          conditions:
          - condition: template
            value_template: '{{ action in [''add'', ''lock'', ''override''] or action_type
              == ''light_override'' }}'
          sequence:
          - variables:
              is_off_cmd: '{{ action_type == ''light_override'' and p.action_value
                == ''off'' }}'
              is_schedule: '{{ (action_type == ''schedule'' or action == ''schedule''
                or p.intent_type == ''schedule'') }}

                '
              is_override: '{{ (action_type == ''light_override'' or action == ''override''
                or p.intent_type == ''override'') }}'
              intent_type: '{{ ''override'' if is_override else (p.intent_type | default(''motion''))
                }}'
              priority: '{{ 3 if is_schedule else ( 2 if is_override else (p.priority
                | default(1) | int)) }}'
              existing: "{% \n  set active_list = (current_stack ) if current_stack
                is string else current_stack \n%} \n{{ active_list | selectattr('claimant_id',
                'eq', cid) | first | default({}) }}"
              new_stack: "{%\n  set active_list = (current_stack ) if current_stack
                is string else current_stack \n%} \n{%\n  set registry = state_attr('sensor.global_variable_registry',
                'vars') | default({}, true) \n%}   \n{%\n  set g_env = registry.get('globals',
                {}).get('environmental', {}) \n%}  \n{%\n  set dur_work = g_env.get('override_duration_work',
                36000) | int \n%}  \n{% \n  set dur_std = g_env.get('override_duration_standard',
                3600) | int \n%}\n{% if is_off_cmd %}\n  {{ active_list | rejectattr('type',
                'eq', 'override') | rejectattr('claimant_id', 'eq', cid) | list }}\n{%
                else %}\n  {% set explicit_lock = p.locked if p.locked is defined
                else none %}\n  {% set final_lock = false %}\n  {% if action == 'lock'
                %}\n    {% set final_lock = true %}\n  {% elif explicit_lock is not
                none %}\n    {% set final_lock = explicit_lock in ['true', true, 'on',
                'ON'] %}\n  {% else %}\n    {% set final_lock = existing.get('locked',
                false) %}\n  {% endif %}\n\n  {% set expiry = none %}\n  {% set seconds
                = p.seconds | default(-2) | int %}\n  \n  {% if not final_lock %}\n
                \   {% if seconds == -1 %}\n      {% set expiry = none %}\n    {%
                elif seconds != -2 %}\n      {% set default_secs = 30 if 'door' in
                cid else 120 %}\n      {% set final_seconds = seconds if seconds >=
                0 else default_secs %}\n      {% set expiry = (now() + timedelta(seconds=final_seconds)).isoformat()
                %}\n    {% elif is_schedule %}\n      {% set current_posture = states('sensor.posture_horizons')
                %}\n      {% set hz = state_attr('sensor.posture_horizons', 'horizons')
                | default({}, true) %}\n      {% if current_posture == 'morning' %}\n
                \       {% set expiry = hz.morning_end %}\n      {% elif current_posture
                == 'evening' %}\n        {% set expiry = hz.evening_end %}\n      {%
                elif current_posture == 'night' %}\n        {% set expiry = hz.night_end
                %}\n      {% else %}\n        {% set expiry = (now() + timedelta(hours=1)).isoformat()
                %}\n      {% endif %}\n    {% elif is_override %}\n      {% if seconds
                != -2 %}\n        {% set is_work_area = ('work' in (labels(target_area)
                | default([], true))) %}\n        {% set expiry = (now() + timedelta(seconds=(p.seconds
                | default(dur_work if is_work_area else dur_std) | int))).isoformat()
                %}\n      {% else %}\n        {% set expiry = none %}\n      {% endif
                %}\n    {% else %}\n      {% set default_secs = 30 if 'door' in cid
                else 120 %}\n      {% set final_seconds = seconds if seconds >= 0
                else default_secs %}\n      {% set expiry = (now() + timedelta(seconds=final_seconds)).isoformat()
                %}\n    {% endif %}\n  {% endif %}\n\n  {% set entry = {\n    'type':
                intent_type,\n    'claimant_id': cid,\n    'priority': priority,\n
                \   'expiry': expiry,\n    'locked': final_lock,\n    'action_value':
                p.action_value | default('manual' if is_override else ''),\n    'warned':
                false,\n    'skip_warning': (p.skip_warning in ['true', true] or intent_type
                != 'motion' or final_lock),\n    'target_labels': target_labels,\n
                \   'last_updated': now().isoformat()\n  } %}\n  {% set others = active_list
                | rejectattr('claimant_id', 'eq', cid) | list %}\n  {{ others + [entry]
                }}\n{% endif %}"
        - alias: Remove
          conditions:
          - condition: template
            value_template: '{{ action == ''remove'' }}'
          sequence:
          - variables:
              new_stack: '{% set active_list = (current_stack | from_json) if current_stack
                is string else current_stack %} {{ active_list | rejectattr(''claimant_id'',
                ''eq'', cid) | list }}'
        - alias: Purge
          conditions:
          - condition: template
            value_template: '{{ action == ''purge'' }}'
          sequence:
          - variables:
              new_stack: []
        - alias: Warn
          conditions:
          - condition: template
            value_template: '{{ action == ''warned'' }}'
          sequence:
          - variables:
              new_stack: "{% set active_list = (current_stack | from_json) if current_stack
                is string else current_stack %} {% set ns = namespace(stk=[]) %} {%
                for i in active_list %}\n  {% if i.claimant_id == cid %}\n    {% set
                ns.stk = ns.stk + [dict(i, warned=true, last_updated=now().isoformat(),
                expiry=(now() + timedelta(seconds=20)).isoformat())] %}\n  {% else
                %}\n    {% set ns.stk = ns.stk + [i] %}\n  {% endif %}\n{% endfor
                %} {{ ns.stk }}"
      - variables:
          top_expiry: "{% if new_stack is defined and new_stack | length > 0 %}\n
            \ {% set ns_hold = namespace(active=false) %}\n  {% for item in new_stack
            %}\n    {% if item.expiry in [none, null, 'none', 'null', 'infinite',
            ''] or item.locked == true %}\n      {% set ns_hold.active = true %}\n
            \   {% endif %}\n  {% endfor %}\n\n  {% if ns_hold.active %}\n    none\n
            \ {% else %}\n    {% set ns_tokens = namespace(valid=[]) %}\n    {% for
            item in new_stack %}\n      {% set item_exp = as_datetime(item.expiry)
            %}\n      {% if item_exp is not none and item_exp > now() %}\n        {%
            set lock_score = 1000000 if item.locked else 0 %}\n        {% set priority_score
            = (item.priority | default(1) | int) * 10000 %}\n        {% set weight
            = lock_score + priority_score + as_timestamp(item_exp) %}\n        {%
            set ns_tokens.valid = ns_tokens.valid + [{'expiry': item.expiry, 'weight':
            weight}] %}\n      {% endif %}\n    {% endfor %}\n\n    {% if ns_tokens.valid
            | length > 0 %}\n      {% set winner = ns_tokens.valid | sort(attribute='weight',
            reverse=true) | first %}\n      {{ winner.expiry }}\n    {% else %}\n
            \     none\n    {% endif %}\n  {% endif %}\n{% else %}\n  none\n{% endif
            %}"
          domain_state: "{% set stack_count = new_stack | count %} {% set winner =
            new_stack | sort(attribute='priority', reverse=true) \n   | sort(attribute='locked',
            reverse=true) \n   | first | default({}) %}\n\n{% if stack_count == 0
            %}\n  idle\n{% elif winner.get('locked', false) %}\n  locked\n{% elif
            top_expiry is none or top_expiry == 'none' %}\n  active\n{% else %}\n
            \ {% set t_diff = as_timestamp(top_expiry) - as_timestamp(now()) %}\n
            \ {% if t_diff <= 0 %}\n    expired\n  {% elif t_diff <= 120 %}\n    expiring\n
            \ {% else %}\n    active\n  {% endif %}\n{% endif %}"
          updated_domain_payload: "{{ {\n  'state': domain_state,\n  'expiry': top_expiry,\n
            \ 'intent_stack': new_stack,\n  'last_updated': now().isoformat()\n} }}"
          safe_claimant_id: '{{ cid | default(''system'', true) }}'
          local_registry: sensor.{{ target_area }}_presence_intent
          final_attributes: "{% set target_dom = domain | default('lighting', true)
            %} {% set reg_state = states[local_registry] if local_registry in states
            else none %} {% set raw_attrs = reg_state.attributes if reg_state is not
            none else {} %} {% set ns = namespace(doms={}) %}\n{% if raw_attrs is
            mapping %}\n  {% for k, v in raw_attrs.items() if k is string %}\n    {%
            if not k.startswith('_') and k not in ['last_claimant', 'last_updated',
            'friendly_name', 'icon', 'restored', 'supported_features', 'entity_id']
            and v is mapping %}\n      {% set ns.doms = dict(ns.doms, **{k: v}) %}\n
            \   {% endif %}\n  {% endfor %}\n{% endif %}\n{% set updated_doms = dict(ns.doms,
            **{target_dom: updated_domain_payload}) %} {% set result = dict(\n  last_claimant=safe_claimant_id,\n
            \ last_updated=now().isoformat(),\n  **updated_doms\n) %} {{ result }}"
      - alias: Project State to Local Event Bus
        event: presence_state_update
        event_data:
          area_id: '{{ target_area }}'
          domain: '{{ domain }}'
          state: "{% set ns_lock = namespace(active=false) %} {% if new_stack is defined
            and new_stack | length > 0 %}\n  {% for item in new_stack %}\n    {% if
            item.expiry in [none, null, 'none', 'null', 'infinite', ''] or item.locked
            == true %}\n      {% set ns_lock.active = true %}\n    {% endif %}\n  {%
            endfor %}\n{% endif %}\n{% if ns_lock.active %}\n  ACTIVE\n{% elif new_stack
            | length > 0 and top_expiry is not none and top_expiry != 'none' and top_expiry
            | string != '' %}\n  {{ 'COOLDOWN' if as_timestamp(top_expiry) - as_timestamp(now())
            > 0 else 'EVICTED' }}\n{% else %}\n  EVICTED\n{% endif %}"
          last_claimant: '{{ cid }}'
          last_intent_type: '{{ intent_type }}'
          intent_stack: '{{ new_stack }}'
          expiry_ttl: "{% if top_expiry is not none and top_expiry != 'none' and top_expiry
            | string != '' %}\n  {% set delta = as_timestamp(top_expiry) - as_timestamp(now())
            %}\n  {{ delta | round(3) if delta > 0 else 0 }}\n{% else %}\n  0\n{%
            endif %}"
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - sensor.presence_state_registry
          attribute: active_intent_stacks
        timeout:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 50
      - variables:
          latest_stack: "\n{%\n  set wait_state = wait.trigger.to_state if (wait.completed
            and wait.trigger is defined and wait.trigger.to_state is not none) else
            none \n%} \n{% \n  set trigger_stacks = wait_state.attributes.get('active_intent_stacks')
            if wait_state is not none else none \n%}\n{%\n  set stacks = trigger_stacks
            if trigger_stacks is not none else state_attr('sensor.presence_state_registry',
            'active_intent_stacks') \n%}\n{{ (stacks if stacks is mapping else {}).get(target_area,
            {}) }}"
      - delay:
          milliseconds: 20
        enabled: false
      - action: mqtt.publish
        data:
          topic: homeassistant/sensor/{{ target_area }}/presence/attributes
          payload: '{{ latest_stack | tojson }}'
          retain: true
      - action: mqtt.publish
        data:
          topic: homeassistant/sensor/{{ target_area }}/presence/state
          payload: "{% set attr = final_attributes if final_attributes is mapping
            else (final_attributes | from_json | default({}, true)) %} \n\n\n{% set
            target_dom = domain | default('lighting', true) %} \n\n\n{{ attr.get(target_dom,
            {}).get('state', 'idle') }}"
          retain: true
  mode: queued
  max: 20
  trace:
    stored_traces: 50
- id: '1784647874766'
  alias: UCC - ESPHome Switch Coordinator (V1.0)
  description: '# UCC - ESPHOME SWITCH COORDINATOR (V1.0)

    Processes native ESPHome hardware gestures (press, double, hold) from smart switches
    and maps them into standardized Universal Controller Commands (UCC). Emits manual
    overrides into the GPE Intent Engine when areas are override-eligible.'
  triggers:
  - trigger: event
    event_type: esphome.switch_event
  actions:
  - variables:
      device_name: '{{ trigger.event.data.entity_id | replace(''esphome.'', '''')
        }}'
      target_area: '{{ trigger.event.data.target_area | default(area_id(trigger.event.data.entity_id))
        }}'
      click_type: '{{ trigger.event.data.event_value | default(''press'') }}'
      domain: '{{ trigger.event.data.domain | default(''lighting'') }}'
      is_eligible: '{{ target_area in label_areas(''area_override_eligible'') }}'
      action_map:
        press:
          type: light_call
          action: toggle
          seconds: -1
        double:
          type: area_registry_update
          action: add
          domain: ventilation
          seconds: 900
        hold:
          type: light_call
          action: turn_off
          seconds: 0
      cmd: '{{ action_map.get(click_type, {}) }}'
  - if:
    - condition: template
      value_template: '{{ cmd is defined and cmd != {} }}'
    then:
    - alias: Emit Universal Controller Command
      event: universal_controller_command
      event_data:
        source_device: esphome_switch
        action_type: '{{ cmd.type }}'
        command_input: '{{ cmd.action }}'
        target:
          area_id: '{{ target_area }}'
        metadata:
          claimant_id: switch.{{ device_name }}
          domain: '{{ cmd.domain | default(domain) }}'
          seconds: '{{ cmd.seconds }}'
          publish_intent: '{{ ''add'' if is_eligible and cmd.seconds != 0 else ''remove''
            }}'
          intent_type: '{{ ''override'' if is_eligible else ''motion'' }}'
        data_payload: '{{ trigger.event.data }}'
    - action: logbook.log
      data:
        name: UCC_ESPHOME_SENT
        message: 'Area: {{ target_area }} | Gesture: {{ click_type }} | Action: {{
          cmd.type }} ({{ cmd.action }})'
        entity_id: sensor.ucc_registry_log
  mode: parallel
  max: 10
  trace:
    stored_traces: 50
- id: gpe_engine_area_context_synchronizer
  alias: GPE - Area Context Synchronizer
  triggers:
  - event_type: esphome.gpe_area_request_update
    id: Switch_Request
    trigger: event
  - entity_id:
    - sensor.global_variable_registry
    id: Broadcast
    trigger: state
  conditions: []
  actions:
  - variables:
      target_area: "{% if trigger.id == 'Switch_Request' %}\n  {{ trigger.event.data.area_id
        | default('none') }}\n{% elif trigger.id == 'Broadcast' %}\n  {{ trigger.payload_json.target.area_id
        | default('none') }}\n{% else %}\n  {{ area_id(trigger.entity_id) | default('none')
        }}\n{% endif %}"
      target_device_name: "{% if trigger.id == 'Switch_Request' %}\n  {{ trigger.event.data.device_name
        | default(target_area ~ '_switch') }}\n{% else %}\n  {{ target_area ~ '_switch'
        }}\n{% endif %}"
      target_esphome_service: esphome.{{ target_device_name | replace('-', '_') }}_gpe_area_update
      profile_sensor: sensor.{{ target_area }}_profile
      profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
        }}'
      profile_topography: '{{ state_attr(profile_sensor, ''topography'') | default({},
        true) }}'
      profile_features: '{{ state_attr(profile_sensor, ''features'') | default({},
        true) }}'
      profile_scenes: '{{ state_attr(profile_sensor, ''scenes'') | default({}, true)
        }}'
      profile_timeouts: '{{ state_attr(profile_sensor, ''timeouts'') | default({},
        true) }}'
      door_entities: '{{ profile_topography.get(''door_entities'', []) }}'
      door_entity: '{{ door_entities | first | default(''none'') }}'
      has_door: '{{ door_entity != ''none'' and states(door_entity) not in [''unknown'',
        ''unavailable''] }}'
      door_mqtt_topic: "{% if has_door %}\n  {{ device_name(door_entity) | default(area_name(target_area)
        ~ ' Door') }}\n{% else %}\n  none\n{% endif %}"
      root_topic: '{{ profile_topography.get(''root_topic'', ''zigbee2mqtt'') }}'
      light_topic: '{{ device_name(profile_topography.get(''light_entities'', [area_name(target_area)]
        ) | first ) }}'
      fan_topic: '{{ device_name(profile_topography.get(''fan_entities'', [area_name(target_area)
        ~ '' Fan'']) | first ) }}'
  - condition: template
    value_template: '{{ target_area != ''none'' and profile_exists }}'
  - action: '{{ target_esphome_service }}'
    data:
      area_id: '{{ target_area }}'
      root_topic: '{{ root_topic }}'
      light_topic: '{{ light_topic }}'
      fan_topic: '{{ fan_topic }}'
      door_topic: '{{ door_mqtt_topic }}'
      scene_eligible: '{{ profile_features.get(''scene_eligible'', true) }}'
      use_scene: '{{ profile_features.get(''use_scene'', true) }}'
      light_on_scene: '{{ profile_scenes.get(''light_on'', 10) | int }}'
      light_off_scene: '{{ profile_scenes.get(''light_off'', 0) | int }}'
      light_sec: '{{ profile_timeouts.get(''light_sec'', 120) | int }}'
      fan_sec: '{{ profile_timeouts.get(''fan_sec'', 300) | int }}'
  - action: logbook.log
    data:
      message: 'GPE Context Synced -> Area: {{ target_area }} | Target Action: {{
        target_esphome_service }}'
      name: ESPHome Area Context Sync
  mode: queued
  max: 10
- id: '1785373624509'
  alias: UCC - Loopback Coordinator V2.5
  description: Handles relative steering, history tracking registers, and UI selector
    state loopbacks
  triggers:
  - trigger: event
    id: bus_event
    event_type: universal_controller_command
    event_data:
      action_type: scene_cycle
    enabled: false
  - trigger: event
    event_type: call_service
    event_data:
      domain: scene
      service: turn_on
    id: core_scene_call
    enabled: false
  - trigger: select.selection_changed
    target:
      label_id: scene
    options: {}
    id: option_change
    enabled: false
  actions:
  - variables:
      is_service_call: '{{ trigger.id == ''core_scene_call'' }}'
      is_option_change: '{{ trigger.id == ''option_change'' }}'
      called_scene_entity: "{% if is_service_call %}\n  {{ trigger.event.data.service_data.entity_id[0]
        if trigger.event.data.service_data.entity_id is list else trigger.event.data.service_data.entity_id
        }}\n{% else %}\n  none\n{% endif %}"
      payload: "{% if is_service_call %}\n  {{ \n    {\n     'source_device': 'native_core_scene_call',
        \n     'action_value': called_scene_entity.split('.')[1] \n        | replace(area_id(called_scene_entity)
        | default('none', true) ~ '_', '')\n        | replace('_', ' ')\n        |
        title\n    }\n  }}\n{% elif is_option_change %}\n  {{ \n    {\n     'source_device':
        'native_select_option', \n     'action_value': trigger.to_state.state\n    }\n
        \ }}\n{% else %}\n  {{ trigger.event.data }}\n{% endif %}"
      target_area: "{% if is_service_call %}\n  {{ area_id(called_scene_entity) |
        default('none', true) }}\n{% elif is_option_change %}\n  {{ area_id(trigger.to_state.entity_id)
        }}\n{% else %}\n  {{ payload.get('target', {}).get('area_id', 'none') }}\n{%
        endif %}"
      action_raw: '{{ payload.action_value | default(''next'') | string }}

        '
      target_select: select.{{ target_area }}_matrix_scene
      current_history: '{{ state_attr(target_select, ''history_stack'') | default([],
        true) | replace('':'','''') }}'
      local_options: '{{ state_attr(target_select, ''options'') | default([], true)
        }}'
      zb_options: "{% set ns = namespace(found=[]) %}\n{% set prefix = 'scene.' ~
        target_area ~ '_' %}\n{% for s in states.scene | selectattr('entity_id', 'search',
        '^' ~ prefix ~ '[0-9]*0_') %}\n  {% set suffix = s.entity_id | replace(prefix,
        '', 1) %}\n  {% set parts = suffix.split('_') %}\n  {% set ns.found = ns.found
        + [ parts[0] ~ ' ' ~ parts[1:] | join(' ') | title ] %}\n{% endfor %}\n{{
        ns.found | unique | sort }}"
      is_zigbee_scene: '{{ zb_options is list and zb_options | count > 0 }}'
      options: '{{ zb_options if is_zigbee_scene else local_options }}'
      t_state: '{{ states(target_select) }}'
  - variables:
      action_resolved: "{% if action_raw in ['next', 'raise', 'select_next'] %}\n
        \ {% set idx = options.index(states(target_select)) | default(0, true) + 1
        %}\n  {{ options[idx] if idx < options | length else options[idx] }}\n{% elif
        action_raw in ['previous', 'lower', 'select_previous'] %}\n  {% set idx =
        options.index(states(target_select)) | default(1, true) - 1 %}\n  {{ options[idx]
        if idx >= 0 else options[-1] }}\n{% elif action_raw in ['off', 'select_first']
        %}\n  {{ options[0] }}\n{% elif action_raw in ['max', 'select_last'] %}\n
        \ {{ options[-1] }}\n{% elif action_raw == 'restore' %}\n  {% set active_history
        = current_history | reject('match', '^0') | reject('eq', '0') | list %}\n
        \ {{ active_history[-1] if active_history | length > 0 else (options[1] if
        options | length > 1 else options[0]) }}\n{% elif action_raw == 'min' %}\n
        \ {{ options[1] if options | length > 1 else options[0] }}\n{% else %}\n  {%
        set by_id = options | select('match', '^' ~ action_raw ~ ' ') | first | default(none)
        %}\n  {% set by_name = options | select('search', action_raw) | first | default(none)
        %}\n  {{ by_id if by_id is not none else (by_name if by_name is not none else
        action_raw) }}\n{% endif %}"
      action_is_local: '{{ action_resolved in local_options }}'
      action_is_zb: '{{ action_resolved in zb_options }}'
      is_valid_option: '{{ action_is_local or action_is_zb }}'
      old_is_valid_option: '{{ action_resolved in options }}'
      parts: '{{ action_resolved.split('' '') if '' '' in action_resolved else [0,
        action_resolved] }}'
      scene_id: '{{ parts[0] | int(0) }}'
      scene_name: '{{ parts[1] | default(''Off'') | title }}'
      history_update: "{{ (current_history + [action_resolved])[-5:] if action_resolved
        != current_history[-1] | default('') else current_history }} \n"
  - event: UCC_CCT_Update
    event_data: {}
    enabled: true
  - condition: template
    value_template: '{{ is_valid_option and target_area != ''none'' }}'
  - alias: Commit History Stack and Selector Metadata
    action: mqtt.publish
    data:
      topic: homeassistant/select/{{ target_area }}/scene/attributes
      retain: true
      payload: "{{ {\n  \"options\": options,\n  \"scene\": {\n    \"scene_id\": scene_id,\n
        \   \"scene_name\": scene_name\n  },\n  \"friendly_name\": state_attr(target_select,
        'friendly_name'),\n  \"icon\": state_attr(target_select, 'icon'),\n  \"history_stack\":
        history_update\n} | tojson }}"
  - alias: Synchronize Select Component State
    action: mqtt.publish
    data:
      topic: homeassistant/select/{{ target_area }}/scene/state
      retain: true
      payload: "{{ {\n  \"scene_id\": scene_id,\n   \"scene_name\": scene_name\n}
        | tojson }}"
  - condition: template
    value_template: '{{ not is_service_call }}'
  - alias: Broadcast Clean Scene Vector Token
    event: ucc_scene_vector_call
    event_data:
      area_id: '{{ target_area }}'
      scene_id: '{{ scene_id }}'
      scene_name: '{{ scene_name }}'
      is_zigbee_scene: '{{ is_zigbee_scene }}'
      source_device: '{{ payload.source_device | default(''ha_ui_selector'') }}'
  - alias: Log Vector Conversion to Logbook
    action: logbook.log
    data:
      name: UCC Loopback
      message: 'Resolved command ''{{ action_raw }}'' -> Vector broadcasted: ID {{
        scene_id }} ({{ scene_name }})'
      entity_id: '{{ target_select }}'
  mode: parallel
  max: 20
- id: '1785489405718'
  alias: Dummy Scene Change
  description: ''
  triggers:
  - trigger: select.selection_changed
    target:
      label_id: scene
