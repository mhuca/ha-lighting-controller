      milliseconds: 250
  mode: single
- id: '1779850284319'
  alias: Override - Unified Gateway V4.0
  description: "# SYSTEM: OVERRIDE GATEWAY (V4.0)\n\nCentral processing engine for
    manual overrides events.\n\n## 1. PURPOSE\n\nGatekeeps non-automated state changes.
    It acts as the bridge between physical \nhardware (Relays/Switches), environmental
    sensors (Night Light), and the \nGlobal Presence Engine (GPE) registry.\n\n##
    2. ARCHITECTURE\n\n* **Override Branch**: Monitors `sensor.active_override_source`
    to translate \n  physical toggles into 'Override' intents within the lighting
    registry.\n  \n\n## 3. DEPENDENCIES\n\n* `sensor.active_override_source`: Unified
    stream of physical relay events.\n\n* `light.hallway_front_main`: Physical relay
    events.\n"
  triggers:
  - trigger: state
    entity_id:
    - sensor.active_override_source
    from:
    to:
    id: Override_id
    enabled: false
  - trigger: state
    entity_id: light.hallway_front_main
    attribute: brightness
    id: Front Change
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/+
      payload: toggle
      value_template: '{{ value_json.action if value_json.action is defined else ''''
        }}

        '
    id: Zigbee_id
    enabled: true
  - trigger: state
    entity_id:
    - light.hallway_front_main
    from:
    to:
    enabled: false
  - trigger: light.turned_off
    target:
      label_id: override_eligible
    options:
      behavior: each
    id: Override_id
  - trigger: light.turned_on
    target:
      label_id: override_eligible
    options:
      behavior: each
    id: Override_id
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Override_id
      sequence:
      - variables:
          source_entity: '{{ trigger.entity_id }}

            '
          current_state: '{{ states(source_entity) }}'
          area_key: '{{ area_id(source_entity) | default(''none'') }}'
          entity_labels: '{{ labels(source_entity) }}'
          action_type: lighting_registry_update
          action_value: '{{ states[source_entity].state }}'
          action: add
          claimant_id: '{{ source_entity }}'
          intent_type: override
          seconds: '{{ -1 if is_state(source_entity, ''on'') else 0 }}'
          source_device: manual_action
      - if:
        - condition: template
          value_template: '{{ trigger.to_state.context.parent_id is none and trigger.to_state.context.user_id
            is none }}'
        then:
        - event: lighting_registry_update
          event_data:
            action: '{{ action }}'
            action_type: '{{ action_type }}'
            claimant_id: '{{ claimant_id }}'
            intent_type: '{{ intent_type }}'
            target:
              area_id: '{{ area_key }}'
            seconds: '{{ seconds }}'
            source_device: '{{ source_device }}'
          enabled: true
        - action: logbook.log
          metadata: {}
          data:
            name: Lighting Override Engine
            message: 'Override for {{ area_key }} State: {{ states[source_entity].state
              }} '
            entity_id: '{{ source_entity }}'
    - conditions:
      - condition: trigger
        id:
        - Front Change
      sequence:
      - variables:
          target_state: '{{ states(''light.hallway_front_main'') }}'
          action_value: '{% if target_state == ''off'' %} 0 {% else %} {{ state_attr(''light.hallway_front_main'',
            ''brightness'') | int(255) }} {% endif %}

            '
          command_input: turn_{{ target_state }}
      - alias: Emit Intent Event
        event: universal_controller_command
        event_data:
          source_device: physical_switch_hallway
          action_type: light_call
          action_value: '{{ action_value }}'
          command_input: '{{ command_input }}'
          target:
            area_id: hallway
            label_id:
            - Front
          metadata:
            claimant_id: '{{ device_id( trigger.entity_id ) }}'
            seconds: '{{ -1 if command_input == ''turn_on'' else 0 }}'
            action: '{{ ''add'' if command_input == ''turn_on'' else ''remove'' }}'
            intent_type: override
      - data:
          name: UCC_SENT
          message: 'Area: {{area_name(trigger.entity_id)}} | Action: light_call |
            Value: "{{ action_value }} | Label: Front | {{ trigger.entity_id }}'
          entity_id: sensor.ucc_registry_log
        action: logbook.log
      - alias: Ignore the Ramp Noise
        delay:
          seconds: 1.5
    - conditions:
      - condition: trigger
        id:
        - Zigbee_id
      sequence:
      - variables:
          payload: '{{ trigger.payload_json }}'
          device_name: '{{ trigger.topic.split(''/'')[1] }}'
          target_area: '{{ area_id(''sensor.'' ~ device_name | slugify ~ ''_action'')
            | default(''none'') }}'
          profile_sensor: sensor.{{ target_area }}_profile
          profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
            }}'
          profile_topography: '{{ state_attr(profile_sensor, ''topography'') | default({},
            true) }}'
          profile_policy_map: '{{ state_attr(profile_sensor, ''policy_map'') | default({},
            true) }}'
          profile_features: '{{ state_attr(profile_sensor, ''features'') | default({},
            true) }}'
          is_bind_eligible: '{{ profile_features.get(''bind_eligible'', false) }}'
          use_scene: '{{ profile_features.get(''scene_eligible'', false) }}'
          target_light: "{{ label_entities('main') \n   | select('match', 'light\\.')\n
            \  | select('in', area_entities(target_area)) \n   | first | default('none')
            }}\n"
          intended_command: '{{ ''turn_off'' if is_state(target_light, ''on'') else
            ''turn_on'' }}'
          continue: '{{ is_bind_eligible and target_light | count > 0 }}'
          use_night_settings: "{% set registry = state_attr('sensor.global_variable_registry',
            'vars') \n   | default({}, true) %}\n{% set g_env = registry.get('globals',
            {}).get('environmental', {}) %}\n\n{{\n  profile_features.get('night_light',
            false) and is_state(g_env.night_posture_sensor, 'on') \n}}\n"
      - condition: template
        value_template: "{{ continue }}\n   "
      - if:
        - condition: template
          value_template: '{{ not use_scene }}'
        then:
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: z2m_physical_rocker
            action_type: light_call
            action_value: '{{ ''night_mode'' if use_night_settings else ''day_mode''
              }}'
            command_input: '{{ intended_command }}'
            target:
              area_id: '{{ target_area }}'
              label_id:
              - main
            data_payload: '{{ payload }}'
            metadata:
              claimant_id: '{{ device_name }}'
              seconds: '{{ -1 if intended_command == ''turn_on'' else 0 }}'
              action: '{{ ''add'' if intended_command == ''turn_on'' else ''remove''
                }}'
              intent_type: override
            overrides: {}
        - alias: Direct Inject into Lighting Registry
          event: lighting_registry_update
          event_data:
            action: add
            action_type: lighting_registry_update
            claimant_id: '{{ device_name }}'
            intent_type: override
            target:
              area_id: '{{ target_area }}'
              label_id:
              - main
            seconds: '{{ -1 if intended_command == ''turn_on'' else 0 }}'
            source_device: z2m_physical_rocker
          enabled: false
        else:
        - event: lighting_registry_update
          event_data:
            action: remove
            claimant_id: '{{ device_name }}'
            target:
              area_id: '{{ target_area }}'
              label_id:
              - main
            intent_type: override
          enabled: false
        - event: universal_controller_command
          event_data:
            action_type: scene_cycle
            target:
              area_id: '{{ target_area }}'
            action_value: restore
            source_device: '{{ device_name }}'
            metadata:
              claimant_id: '{{ device_name }}'
              action: remove
              intent_type: override
      - data:
          name: UCC_SENT
          message: 'Area: {{ target_area }} | Action: light_call | Value: {{ target_light
            }}'
          entity_id: sensor.ucc_registry_log
        action: logbook.log
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 250
    enabled: true
  mode: single
  trace:
    stored_traces: 50
- id: '1779883000869'
  alias: 'System: Posture & Intent Gateway (V5.0)'
  description: "# SYSTEM: POSTURE & INTENT GATEWAY (V5.0)\nCentral processing engine
    for house-wide posture transitions.\n## 1. PURPOSE\nGatekeeps non-automated state
    changes. It acts as the bridge between physical  hardware (Relays/Switches), environmental
    sensors (Night Light), and the  Global Presence Engine (GPE) registry.\n## 2.
    ARCHITECTURE\n  \n* **Posture Branch**: Bridges the `binary_sensor.night_light_sensor`
    to the \n  House Posture Alarm Panel, triggering mode shifts.\n  \n* **Sweep Engine**:
    Listens for posture changes to perform a 'Smart Purge' \n  of manual overrides
    when transitioning into restrictive modes (Night/Away).\n\n## 3. DEPENDENCIES\n*
    `alarm_control_panel.house_posture`: The master state machine for the matrix.\n*
    `label:override_eligible`: Required on entities to participate in Smart Purges."
  triggers:
  - trigger: state
    entity_id:
    - sensor.schedule_posture
    from:
    id: Night_id
    enabled: true
    to:
  - trigger: state
    entity_id:
    - alarm_control_panel.house_posture_engine_house_posture
    id: posture_shift_trigger
    enabled: true
  - trigger: mqtt
    id: ScheduleChange
    options:
      topic: home/schedule/+/set
    enabled: true
  conditions: []
  actions:
  - variables:
      posture: '{{ states(''sensor.schedule_posture'') | default(''daylight'') }}'
      current_rules: "{% set registry_str = 'sensor.global_variable_registry' %}    \n{{
        (state_attr(registry_str, 'vars') | default({}, true)).get('globals', {}).get('policy_map',
        {}).get(posture, {}) }}"
      lighting_schedules: '{{ label_entities(''light_schedule'') | list | sort }}'
  - choose:
    - conditions:
      - condition: trigger
        id: posture_shift_trigger
      sequence:
      - variables:
          new_state: '{{ trigger.to_state.state | default(''none'') }}'
          posture_slug: "{% if new_state == 'armed_night' %}\n  night \n{% elif new_state
            in ['armed_away', 'armed_vacation'] %}\n  away \n{% else %} \n  default
            \n{% endif %}"
      - if:
        - condition: template
          value_template: '{{ posture_slug in [''night'', ''away''] }}'
        then:
        - repeat:
            for_each: "{% set eligible = label_entities('override_eligible') %} \n\n{{
              states.light \n  | selectattr('state', 'eq', 'on') \n  | map(attribute='entity_id')\n
              \ | intersect(eligible)\n  | list }}"
            sequence:
            - event: lighting_registry_update
              event_data:
                action: remove
                claimant_id: '{{ repeat.item }}'
                area_key: '{{ area_id(repeat.item) }}'
                intent_type: override
    - conditions:
      - condition: trigger
        id:
        - ScheduleChange
      sequence:
      - variables:
          discoveryPrefix: homeassistant
          appId: schedule
          topic: '{{ trigger.topic.split(''/'') | default([]) }}'
          target_area: '{{ topic[2] }}'
          area_policy: '{{ labels(target_area) }}'
          use_scene: '{{ ''scene_eligible'' in area_policy }}'
          current_option: "{% set schedules =  label_entities('light_schedule') |
            list %}\n{{ states(area_entities(target_area) \n  | intersect(schedules)
            \n  | first) }}\n"
          target_option: '{{ trigger.payload | default(''none'') }}'
      - if:
        - condition: template
          value_template: '{{ target_option != current_option }}'
        then:
        - action: mqtt.publish
          data:
            topic: '{{ discoveryPrefix }}/select/{{ target_area }}/{{ appId }}/state'
            payload: '{{ target_option }}'
            retain: true
          enabled: true
        - choose:
          - conditions:
            - alias: Area Uses Scenes
              condition: template
              value_template: '{{ use_scene and target_option == ''on'' }}'
            sequence:
            - event: universal_controller_command
              event_data:
                action_type: scene_cycle
                target:
                  area_id: '{{ target_area }}'
                action_value: restore
                source_device: '{{ topic[3:] | join(''_'') }}'
              enabled: true
          - conditions:
            - alias: Not Area Uses Scenes
              condition: template
              value_template: '{{ not use_scene and target_option == ''on'' }}'
            sequence:
            - event: universal_controller_command
              event_data:
                action_type: light_call
                command_input: turn_on
                target:
                  area_id: '{{ target_area }}'
                  label_id:
                  - main
                action_value: day_mode
                source_device: '{{ topic[3:] | join(''_'') }}'
              enabled: true
            - event: lighting_registry_update
              event_data:
                action: add
                claimant_id: schedule_service
                target:
                  area_id: '{{ target_area }}'
                intent_type: schedule
          - conditions:
            - condition: template
              value_template: '{{ ''auto_lights'' in area_policy and not target_option
                == ''on'' }}'
            sequence:
            - event: lighting_registry_update
              event_data:
                action: add
                claimant_id: schedule_service
                target:
                  area_id: '{{ target_area }}'
                intent_type: schedule
                seconds: 0
          default:
          - event: lighting_registry_update
            event_data:
              action: remove
              claimant_id: schedule_service
              target:
                area_id: '{{ target_area }}'
              intent_type: schedule
    default:
    - parallel:
      - if:
        - condition: state
          entity_id: sensor.schedule_posture
          state: night
        then:
        - action: alarm_control_panel.alarm_arm_night
          target:
            entity_id: alarm_control_panel.house_posture_engine_house_posture
          data: {}
        else:
        - if:
          - condition: state
            entity_id: alarm_control_panel.house_posture_engine_house_posture
            state:
            - armed_night
          then:
          - action: alarm_control_panel.alarm_disarm
            target:
              entity_id: alarm_control_panel.house_posture_engine_house_posture
            data: {}
      - alias: Process Light Schedules
        repeat:
          for_each: '{{ lighting_schedules }}'
          sequence:
          - variables:
              selector: '{{ repeat.item }}'
              area_policy: '{{ labels(area_id(repeat.item)) }}'
              use_scene: '{{ ''scene_eligible'' in area_policy }}'
              current_option: '{{ states(repeat.item) }}'
              current_posture: '{{ current_rules.presence if current_rules.presence
                is defined else [''day_light''] }}

                '
              target_option: "{# Evaluate matching targets based on priority order
                #}  {% if\ncurrent_posture in area_policy or 'day_light' in area_policy
                \ %}\n  presence\n{% elif (current_rules.on is defined and current_rules.on
                in area_policy) %}\n  on\n{% else %}\n  off\n{% endif %} \n\n{# {%
                if posture in ['morning', 'evening'] and 'auto_lights' in\n\narea_policy
                %}\n  on\n{% elif (posture == 'night' and 'night_light' in area_policy)
                or (posture !=\n\n'night' and 'day_light' in area_policy ) %}\n  presence\n{%
                else %}\n  off\n{% endif %} #}"
          - alias: If Schedule Option Changes Update
            if:
            - condition: template
              value_template: '{{ current_option != target_option }}'
            then:
            - action: select.select_option
              metadata: {}
              target:
                entity_id: '{{ repeat.item }}'
              data:
                option: '{{ target_option }}'
  mode: parallel
  max: 20
  trace:
    stored_traces: 90
