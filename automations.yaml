          - event: lighting_registry_update
            event_data:
              action: add
              owner_id: '{{ source_entity }}'
              area_key: '{{ area_key }}'
              seconds: -1
              intent_type: motion
        - conditions:
          - condition: template
            value_template: '{{ use_scene }}'
