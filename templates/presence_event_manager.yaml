trigger:
  - trigger: event
    event_type: "presence_state_update"
sensor:
  - name: "Presence State Registry"
    unique_id: presence_state_registry
    state: >
      {# The primary state counts areas actively pending a Janitor cleanup sweep #}
      {% set areas = state_attr(this.entity_id, 'active_areas') or {} %}
      {{ areas | length }}
    unit_of_measurement: "areas"
    icon: >
      {% if states(this.entity_id) | int(0) > 0 %}
        mdi:home-floor-g
      {% else %}
        mdi:home-outline
      {% endif %}
    attributes:
      # active_areas: >
      #   {# 1. Initialize Current Registry State #}
      #   {% set current = state_attr(this.entity_id, 'active_areas') or {} %}

      #   {# 2. Extract Event Context #}
      #   {% set target_area = trigger.event.data.area_id | default('unknown') %}
      #   {% set new_state = trigger.event.data.state | default('EVICTED') %}
      #   {% set claimant = trigger.event.data.last_claimant | default('system') %}
      #   {% set intent_type = trigger.event.data.last_intent_type | default('motion') %}
      #   {% set ttl = trigger.event.data.expiry_ttl | default(0) | float %}
      #   {% set now_ts = as_timestamp(now()) | round(3) %}

      #   {# 3. Standardized Cache Lifecycle Contract #}
      #   {% if new_state == 'COOLDOWN' and target_area != 'unknown' %}
      #     {# --- THE MERGE PATH --- #}
      #     {# Area has entered a transient cooldown phase. Track it with a strict numeric expiration #}
      #     {% set expiry_ts = (now_ts + ttl) | round(3) if ttl > 0 else none %}

      #     {% set update = {
      #       target_area: {
      #         'state': 'COOLDOWN',
      #         'last_claimant': claimant,
      #         'last_intent_type': intent_type,
      #         'last_updated': now_ts,
      #         'expiry': expiry_ts
      #       }
      #     } %}
      #     {{ dict(current, **update) }}

      #   {% else %}
      #     {# --- THE EVICTION PATH (ACTIVE, EVICTED, unknown, unavailable) --- #}
      #     {# If the area becomes ACTIVE (in use) or EVICTED (done), scrub it from the Janitor's book instantly #}
      #     {% set ns = namespace(output={}) %}
      #     {% for area, data in current.items() if area != target_area %}
      #       {% set ns.output = dict(ns.output, **{area: data}) %}
      #     {% endfor %}
      #     {{ ns.output }}
      #   {% endif %}

      active_areas: >
        {% set current = state_attr(this.entity_id, 'active_areas') or {} %}
        {% set target_area = trigger.event.data.area_id | default('unknown', true) %}
        {% set target_dom = trigger.event.data.domain | default('lighting', true) %}
        {% set new_state = trigger.event.data.state | default('EVICTED', true) %}
        {% set claimant = trigger.event.data.last_claimant | default('system', true) %}
        {% set intent_type = trigger.event.data.last_intent_type | default('motion', true) %}
        {% set ttl = trigger.event.data.expiry_ttl | default(0) | float %}
        {% set now_ts = as_timestamp(now()) | round(3) %}

        {# Use clean area key for lighting, and explicit area_domain for secondary domains #}
        {% set janitor_key = target_area if target_dom == 'lighting' else target_area ~ '_' ~ target_dom %}

        {% if new_state == 'COOLDOWN' and target_area != 'unknown' %}
          {% set expiry_ts = (now_ts + ttl) | round(3) if ttl > 0 else none %}
          {% set update = {
            janitor_key: {
              'area_id': target_area,
              'domain': target_dom,
              'state': 'COOLDOWN',
              'last_claimant': claimant,
              'last_intent_type': intent_type,
              'last_updated': now_ts,
              'expiry': expiry_ts
            }
          } %}
          {{ dict(current, **update) }}
        {% else %}
          {# Evict on ACTIVE or EVICTED #}
          {% set ns = namespace(output={}) %}
          {% for k, v in current.items() if k != janitor_key %}
            {% set ns.output = dict(ns.output, **{k: v}) %}
          {% endfor %}
          {{ ns.output }}
        {% endif %}

      # -------------------------------------------------------------------
      # 2. MULTI-DOMAIN INTENT STACK REGISTRY (For Distributor V3.3)
      # -------------------------------------------------------------------
      active_intent_stacks: >
        {% set current_stacks = state_attr(this.entity_id, 'active_intent_stacks') or {} %}
        {% set target_area = trigger.event.data.area_id | default('unknown', true) %}
        {% set target_dom = trigger.event.data.domain | default('lighting', true) %}
        {% set new_state = trigger.event.data.state | default('EVICTED', true) %}
        {% set intent_stack = trigger.event.data.intent_stack | default([], true) %}
        {% set now_ts = as_timestamp(now()) | round(3) %}

        {% if target_area != 'unknown' %}
          {% set existing_area = current_stacks.get(target_area, {}) %}

          {% if new_state != 'EVICTED' and intent_stack | count > 0 %}
            {% set domain_payload = {
              'state': new_state,
              'intent_stack': intent_stack,
              'last_claimant': trigger.event.data.last_claimant | default('system', true),
              'last_updated': now_ts
            } %}
            {% set updated_area = dict(existing_area, **{target_dom: domain_payload}) %}
            {{ dict(current_stacks, **{target_area: updated_area}) }}

          {% else %}
            {% set ns = namespace(doms={}) %}
            {% for d_key, d_val in existing_area.items() if d_key != target_dom %}
              {% set ns.doms = dict(ns.doms, **{d_key: d_val}) %}
            {% endfor %}

            {% if ns.doms | count > 0 %}
              {{ dict(current_stacks, **{target_area: ns.doms}) }}
            {% else %}
              {% set ns_area = namespace(areas={}) %}
              {% for a_key, a_val in current_stacks.items() if a_key != target_area %}
                {% set ns_area.areas = dict(ns_area.areas, **{a_key: a_val}) %}
              {% endfor %}
              {{ ns_area.areas }}
            {% endif %}
          {% endif %}
        {% else %}
          {{ current_stacks }}
        {% endif %}
