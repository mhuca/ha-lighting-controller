- id: '1780876556873'
  alias: System - Profile Generator
  description: Universal Discovery Generator (History Aware)
  triggers: []
  conditions: []
  actions:
  - repeat:
      for_each: '{{ areas() }}'
      sequence:
      - variables:
          target_area: '{{ repeat.item }}'
          current_profile: sensor.{{ target_area }}_profile
          current_policy_map: '{{ state_attr(current_profile,''policy_map'')}}'
          displayName: '{{ area_name(target_area) | default(target_area | replace(''_'',
            '' '') | title) }}'
          discoveryPrefix: homeassistant
          deviceObj:
            identifiers:
            - matrix_area_{{ target_area }}
            name: '{{ displayName }} Matrix'
            model: Universal Matrix Node
            manufacturer: Pico Cartographer
            suggested_area: '{{ displayName }}'
          adminDeviceObj:
            identifiers:
            - profile_admin_{{ target_area }}
            name: '{{ displayName }} Profile Admin'
            model: Universal Matrix Node
            manufacturer: Pico Cartographer
            suggested_area: '{{ displayName }}'
      - variables:
          appId: sub_zone_config
          select_topic: '{{ discoveryPrefix }}/select/{{ target_area }}/sub_zones_eligible/config'
          select_payload:
            name: Active Sub Zone Capability
            unique_id: '{{ target_area }}_sub_zones_eligible_select_unique'
            default_entity_id: select.{{ target_area }}_eligible_sub_zones
            command_topic: homeassistant/select/{{ target_area }}/sub_zones_eligible/set
            optimistic: true
            enabled_by_default: true
            value_template: '{% raw %}{{ value }}{% endraw %}'
            options:
            - counter
            - island
            icon: mdi:vector-selection
            device: '{{ adminDeviceObj }}'
            retain: true
            labels:
            - light_schedule
        alias: Provision Master Sub-Zone Selector
        enabled: false
      - variables:
          appId: sub_zone_config
          select_topic: '{{ discoveryPrefix }}/select/{{ target_area }}/sub_zones_eligible/config'
          select_payload:
        alias: Wipe Out Master Sub-Zone Selector
      - action: mqtt.publish
        data:
          topic: '{{ select_topic }}'
          payload: '{{ select_payload | tojson }}'
          retain: true
        enabled: true
      - delay:
          milliseconds: 100
        enabled: false
      - variables:
          appId: profile
          topic: '{{ discoveryPrefix }}/sensor/{{ target_area }}/{{ appId }}/config'
          payload:
            name: Area Profile
            unique_id: '{{ target_area }}_matrix_profile_unique'
            default_entity_id: sensor.{{ target_area }}_profile
            state_topic: '{{ discoveryPrefix }}/sensor/{{ target_area }}/{{ appId
              }}/state'
            value_template: '{% raw %}{{ value }}{% endraw %}'
            json_attributes_topic: '{{ discoveryPrefix }}/sensor/{{ target_area }}/{{
              appId }}/attributes'
            json_attributes_template: '{% raw %}{{ value_json | tojson }}{% endraw
              %}'
            icon: mdi:card-account-details-star
            retain: true
            device: '{{ deviceObj }}'
        alias: Area Profile Definition
        enabled: false
      - action: mqtt.publish
        data:
          topic: '{{ topic }}'
          payload: '{{ payload | tojson }}'
          retain: true
        enabled: false
      - variables:
          appId: profile_admin
          postures:
          - morning
          - daylight
          - evening
          - night
        alias: Generate Native MQTT UI Selectors
        enabled: false
      - repeat:
          for_each: '{{ postures }}'
          sequence:
          - action: mqtt.publish
            data:
              topic: homeassistant/select/{{ target_area }}/policy_{{ repeat.item
                }}/config
              retain: true
              payload: "{\n  \"name\": \"{{ repeat.item | title }} Policy\",\n  \"unique_id\":
                \"{{ target_area }}_policy_{{ repeat.item }}_select_unique\",\n  \"default_entity_id\":
                \"select.{{ target_area }}_profile_{{ repeat.item }}\",\n  \"command_topic\":
                \"homeassistant/select/{{ target_area }}/policy_{{ repeat.item }}/set\",\n
                \ \"state_topic\": \"homeassistant/select/{{ target_area }}/policy_{{
                repeat.item }}/set\",\n  \"value_template\": \"{% raw %}{{ value }}{%
                endraw %}\",  \n  \"options\": [\"manual\",\"presence\", \"on\", \"off\"],\n
                \ \"icon\": \"mdi:timeline-clock\",\n  \"device\": {{ adminDeviceObj
                | tojson }},\n  \"retain\": true,\n  \"labels\": [\"light_schedule\"]\n}"
            enabled: true
          - delay:
              milliseconds: 100
            enabled: true
          - action: select.select_option
            metadata: {}
            target:
              entity_id: select.{{ target_area }}_profile_{{ repeat.item }}
            data:
              option: '{{ current_policy_map.get( repeat.item, ''manual'') }}'
            enabled: true
        enabled: false
      - variables:
          appId: presence_timer
          timer_topic: '{{ discoveryPrefix }}/timer/{{ target_area }}_{{ appId }}/config'
          timer_payload:
            name: Presence Timer
            unique_id: '{{ target_area }}_{{ appId }}'
            default_entity_id: timer.{{ target_area }}_{{ appId }}
            command_topic: homeassistant/timer/{{ target_area }}_{{ appId }}/set
            state_topic: homeassistant/timer/{{ target_area }}_{{ appId }}/state
            icon: mdi:timer-sand
            retain: true
            device: '{{ deviceObj }}'
        alias: Provision Native Room MQTT Timer
        enabled: false
      - action: mqtt.publish
        data:
          topic: '{{ timer_topic }}'
          payload: '{{ timer_payload | tojson }}'
          retain: true
        enabled: false
      - variables:
          appId: presence_expired
          binary_topic: '{{ discoveryPrefix }}/binary_sensor/{{ target_area }}_{{
            appId }}/config'
          binary_payload:
            name: Presence Expired
            unique_id: '{{ target_area }}_presence_expired_sensor'
            default_entity_id: sensor.{{ target_area }}_{{ appId }}
            state_topic: homeassistant/binary_sensor/{{ target_area }}_{{ appId }}/state
            device: '{{ deviceObj }}'
            retain: true
            labels:
            - lights_off
        alias: Provision Dynamic Cleaner Binary Sensor
        enabled: false
      - variables:
          appId: presence_expired
          binary_topic: '{{ discoveryPrefix }}/binary_sensor/{{ target_area }}_{{
            appId }}/config'
          binary_payload: ''
        alias: Wipe Dynamic Cleaner Binary Sensor
      - action: mqtt.publish
        data:
          topic: '{{ binary_topic }}'
          payload: '{{ binary_payload | tojson }}'
          retain: true
        enabled: true
  mode: single
  trace:
    stored_traces: 50
- id: '1780886314822'
  alias: 'System: Mobile Area Profile Administrator'
  description: Pushes interactive configuration controls directly to your phone without
    using a dashboard
  triggers:
  - trigger: event
    event_type: trigger_mobile_profile_admin
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: PROFILE_SET_POLICY
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.event_type == ''trigger_mobile_profile_admin''
          }}'
      sequence:
      - action: notify.notify
        data:
          title: HUX Profile Engine
          message: 'Select an Area Profile to modify lighting policies:'
          data:
            actions:
            - action: SELECT_MUD_ROOM
              title: Mud Room
            - label: SELECT_MARK_OFFICE
              title: Mark Office
            - label: SELECT_POWDER_ROOM
              title: Powder Room
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.event_type == ''mobile_app_notification_action''
          }}'
      sequence:
      - variables:
          chosen_action: '{{ trigger.event.data.action }}'
          target_area: '{% if ''MUD_ROOM'' in chosen_action %} mud_room {% elif ''MARK_OFFICE''
            in chosen_action %} mark_office {% else %} powder_room {% endif %}'
      - event: area_profile_modify_intent
        event_data:
          action: update
          area: '{{ target_area }}'
          namespace: policy_map
          key:
          - morning
          - daylight
          - evening
          - night
          value:
            morning: presence
            daylight: presence
            evening: presence
            night: presence
  mode: restart
- id: '1780891401687'
  alias: 'Profile Admin: Route Label Select Actions to Node-RED'
  description: Listens for any policy selection changes via household labels and updates
    the Node-RED profile registry
  triggers:
  - trigger: select.selection_changed
    target:
      label_id: light_schedule
    options: {}
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [''unknown'', ''unavailable'',
      none] }}'
  - condition: template
    value_template: '{{ trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - variables:
      entity: '{{ trigger.entity_id }}'
      area: '{{ area_id(entity) | slugify }}'
      raw_string: '{{ entity.replace(''select.'', '''').split(''_profile_'') }}'
      posture: '{{ raw_string[1] }}'
  - event: area_profile_modify_intent
    event_data:
      action: update
      area: '{{ area }}'
      namespace: policy_map
      key: '{{ posture }}'
      value: '{{ trigger.to_state.state }}'
  mode: parallel
  max: 10
- id: '1780894517433'
  alias: 'System: Posture & Intent Gateway (V6)'
  description: "# SYSTEM: POSTURE & INTENT GATEWAY (V6.0)\nCentral processing engine
    for house-wide posture transitions.\n## 1. PURPOSE\nGatekeeps non-automated state
    changes. It acts as the bridge between physical  hardware (Relays/Switches), environmental
    sensors (Night Light), and the  Global Presence Engine (GPE) registry.\n## 2.
    ARCHITECTURE\n  \n* **Posture Branch**: Bridges the `binary_sensor.night_light_sensor`
    to the \n  House Posture Alarm Panel, triggering mode shifts.\n  \n* **Sweep Engine**:
    Listens for posture changes to perform a 'Smart Purge' \n  of manual overrides
    when transitioning into restrictive modes (Night/Away).\n\n## 3. DEPENDENCIES\n*
    `alarm_control_panel.house_posture`: The master state machine for the matrix.\n*
    `label:override_eligible`: Required on entities to participate in Smart Purges."
  triggers:
  - trigger: state
    entity_id:
    - sensor.schedule_posture
    from:
    id: Night_id
    enabled: true
    to:
  - trigger: state
    entity_id:
    - alarm_control_panel.house_posture_engine_house_posture
    id: posture_shift_trigger
    enabled: true
  - trigger: select.selection_changed
    target:
      label_id: light_schedule
    options: {}
    id: ScheduleUpdated
  - trigger: mqtt
    id: ScheduleChange
    options:
      topic: home/schedule/+/set
    enabled: true
  conditions: []
  actions:
  - variables:
      posture: '{{ states(''sensor.schedule_posture'') | default(''daylight'') }}'
      current_rules: "{% set registry_str = 'sensor.global_variable_registry' %}    \n{{
        (state_attr(registry_str, 'vars') | default({}, true)).get('globals', {}).get('policy_map',
        {}).get(posture, {}) }}"
      current_posture: '{{ current_rules.presence if current_rules.presence is defined
        else [''day_light''] }}

        '
      lighting_schedules: '{{ label_entities(''light_schedule'') | list | sort }}'
  - choose:
    - conditions:
      - condition: trigger
        id: posture_shift_trigger
      sequence:
      - variables:
          new_state: '{{ trigger.to_state.state | default(''none'') }}'
          posture_slug: "{% if new_state == 'armed_night' %}\n  night \n{% elif new_state
            in ['armed_away', 'armed_vacation'] %}\n  away \n{% else %} \n  default
            \n{% endif %}"
      - if:
        - condition: template
          value_template: '{{ posture_slug in [''night'', ''away''] }}'
        then:
        - repeat:
            for_each: "{% set eligible = label_entities('override_eligible') %} \n\n{{
              states.light \n  | selectattr('state', 'eq', 'on') \n  | map(attribute='entity_id')\n
              \ | intersect(eligible)\n  | list }}"
            sequence:
            - event: lighting_registry_update
              event_data:
                action: remove
                claimant_id: '{{ repeat.item }}'
                area_key: '{{ area_id(repeat.item) }}'
                intent_type: override
    - conditions:
      - condition: trigger
        id:
        - ScheduleChange
      sequence:
      - variables:
          discoveryPrefix: homeassistant
          appId: schedule
          topic: '{{ trigger.topic.split(''/'') | default([]) }}'
          target_area: '{{ topic[2] }}'
          area_policy: '{{ labels(target_area) }}'
          use_scene: '{{ ''scene_eligible'' in area_policy }}'
          current_option: "{% set schedules =  label_entities('light_schedule') |
            list %}\n{{ states(area_entities(target_area) \n  | intersect(schedules)
            \n  | first) }}\n"
          target_option: '{{ trigger.payload | default(''none'') }}'
      - if:
        - condition: template
          value_template: '{{ target_option != current_option }}'
        then:
        - action: mqtt.publish
          data:
            topic: '{{ discoveryPrefix }}/select/{{ target_area }}/{{ appId }}/state'
            payload: '{{ target_option }}'
            retain: true
          enabled: true
    - conditions:
      - condition: trigger
        id:
        - ScheduleUpdated
      sequence:
      - variables:
          target_area: '{{ area_id(trigger.entity_id) }}'
          area_policy: '{{ labels(target_area) }}'
          use_scene: '{{ ''scene_eligible'' in area_policy }}'
          current_option: '{{ trigger.to_state.state | default(''none'') }}

            '
      - choose:
        - conditions:
          - alias: Area Uses Scenes
            condition: template
            value_template: '{{ use_scene and current_option == ''on'' }}'
          sequence:
          - event: universal_controller_command
            event_data:
              action_type: scene_cycle
              target:
                area_id: '{{ target_area }}'
              action_value: restore
              source_device: '{{ trigger.entity_id }}'
            enabled: true
        - conditions:
          - alias: Not Area Uses Scenes
            condition: template
            value_template: '{{ not use_scene and current_option == ''on'' }}'
          sequence:
          - event: universal_controller_command
            event_data:
              action_type: light_call
              command_input: turn_on
              target:
                area_id: '{{ target_area }}'
                label_id:
                - main
              action_value: day_mode
              source_device: '{{ trigger.entity_id }}'
            enabled: true
          - event: lighting_registry_update
            event_data:
              action: add
              claimant_id: schedule_service
              target:
                area_id: '{{ target_area }}'
              intent_type: schedule
        - conditions:
          - condition: template
            value_template: '{{ ''auto_lights'' in area_policy and not current_option
              == ''on'' }}'
          sequence:
          - event: lighting_registry_update
            event_data:
              action: add
              claimant_id: schedule_service
              target:
                area_id: '{{ target_area }}'
              intent_type: schedule
              seconds: 0
        default:
        - event: lighting_registry_update
          event_data:
            action: remove
            claimant_id: schedule_service
            target:
              area_id: '{{ target_area }}'
            intent_type: schedule
    default:
    - parallel:
      - if:
        - condition: state
          entity_id: sensor.schedule_posture
          state: night
        then:
        - action: alarm_control_panel.alarm_arm_night
          target:
            entity_id: alarm_control_panel.house_posture_engine_house_posture
          data: {}
        else:
        - if:
          - condition: state
            entity_id: alarm_control_panel.house_posture_engine_house_posture
            state:
            - armed_night
          then:
          - action: alarm_control_panel.alarm_disarm
            target:
              entity_id: alarm_control_panel.house_posture_engine_house_posture
            data: {}
      - alias: Process Light Schedules
        repeat:
          for_each: '{{ lighting_schedules }}'
          sequence:
          - variables:
              selector: '{{ repeat.item }}'
              area_policy: '{{ labels(area_id(repeat.item)) }}'
              use_scene: '{{ ''scene_eligible'' in area_policy }}'
              current_option: '{{ states(repeat.item) }}'
              target_option: "{# Evaluate matching targets based on priority order
                #}  {% if\ncurrent_posture in area_policy or 'day_light' in area_policy
                \ %}\n  presence\n{% elif (current_rules.on is defined and current_rules.on
                in area_policy) %}\n  on\n{% else %}\n  off\n{% endif %} \n\n{# {%
                if posture in ['morning', 'evening'] and 'auto_lights' in\n\narea_policy
                %}\n  on\n{% elif (posture == 'night' and 'night_light' in area_policy)
                or (posture !=\n\n'night' and 'day_light' in area_policy ) %}\n  presence\n{%
                else %}\n  off\n{% endif %} #}"
          - alias: If Schedule Option Changes Update
            if:
            - condition: template
              value_template: '{{ current_option != target_option }}'
            then:
            - action: select.select_option
              metadata: {}
              target:
                entity_id: '{{ repeat.item }}'
              data:
                option: '{{ target_option }}'
  mode: parallel
  max: 20
  trace:
    stored_traces: 90
- id: '1780912287440'
  alias: System - Configuration Registry Watchdog (V6.0)
  description: Listens for structural changes to labels or areas and triggers Node-RED.
  triggers:
  - trigger: event
    event_type: entity_registry_updated
    id: entity_change
  - trigger: event
    event_type: device_registry_updated
    id: device_change
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.action in ['create', 'remove'] or\n   (trigger.event.data.action
      == 'update' and \n    (trigger.event.data.changes.labels is defined or \n     trigger.event.data.changes.area_id
      is defined)) }}"
  actions:
  - action: mqtt.publish
    data:
      topic: home/engine/commissioning/request_sync
      retain: false
      qos: 1
      payload: "{\n  \"source\": \"{{ trigger.id }}\",\n  \"action\": \"{{ trigger.event.data.action
        }}\",\n  \"entity_id\": \"{{ trigger.event.data.entity_id | default('none',
        true) }}\",\n  \"area_id\": \"{{ trigger.event.data.area_id | default(trigger.event.data.changes.area_id
        | default('none', true), true) }}\",\n  \"changes\": {{ trigger.event.data.changes
        | default({}, true) | to_json }}\n}"
  mode: parallel
  max: 10
- id: '1780916686217'
  alias: System - Registry Pre-Processor Watchdog (V6.1)
  description: Resolves areas and compiles labeled entity arrays natively before triggering
    Node-RED.
  triggers:
  - trigger: event
    event_type: entity_registry_updated
    id: entity_change
  - trigger: event
    event_type: device_registry_updated
    id: device_change
  - trigger: event
    event_type: area_registry_updated
    id: area_change
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.action in ['create', 'remove'] or\n         trigger.id
      == 'area_change' or\n         (trigger.event.data.action == 'update' and \n
      \         (trigger.event.data.changes.labels is defined or \n           trigger.event.data.changes.area_id
      is defined)) }}"
  actions:
  - variables:
      target_area: "{% set data = trigger.event.data %}\n{% if trigger.id == 'area_change'
        %}\n  {{ data.area_id | default('none') }}\n{% else %}\n  {% if data.area_id
        is defined and data.area_id is not none %}\n    {{ data.area_id }}\n  {% elif
        data.changes is defined and data.changes.area_id is defined and data.changes.area_id
        is not none %}\n    {{ data.changes.area_id }}\n  {% elif trigger.id == 'entity_change'
        and data.entity_id is defined and area_id(data.entity_id) is not none %}\n
        \   {{ area_id(data.entity_id) }}\n  {% elif trigger.id == 'device_change'
        and data.device_id is defined and device_attr(data.device_id, 'area_id') is
        not none %}\n    {{ device_attr(data.device_id, 'area_id') }}\n  {% else %}\n
        \   none\n  {% endif %}\n{% endif %}"
  - condition: template
    value_template: '{{ target_area != ''none'' and target_area | length > 0 }}'
  - variables:
      all_area_entities: '{{ area_entities(target_area) }}'
      discovered_doors: "{% set ns = namespace(entities=[]) %} {% for e in all_area_entities
        if has_value(e) and 'door' in labels(e) %}\n  {% set ns.entities = ns.entities
        + [e] %}\n{% endfor %} {{ ns.entities }}"
      discovered_presence: "{% set ns = namespace(entities=[]) %} {% for e in all_area_entities
        if has_value(e) and 'presence' in labels(e) %}\n  {% set ns.entities = ns.entities
        + [e] %}\n{% endfor %} {{ ns.entities }}"
  - event: profile_sync_required
    event_data:
      area_id: '{{ target_area }}'
      door_entities: '{{ discovered_doors }}'
      presence_entities: '{{ discovered_presence }}'
      reason: Native commissioning asset sweep triggered by {{ trigger.id }}
  mode: parallel
  max: 10
- id: '1780923670428'
  alias: System - Area Profile Provisioning Engine (V7.0)
  description: Sweeps room topology, maps policies/features, and publishes MQTT Profiles
    natively.
  triggers:
  - trigger: event
    event_type: entity_registry_updated
    id: entity_change
  - trigger: event
    event_type: device_registry_updated
    id: device_change
  - trigger: event
    event_type: area_registry_updated
    id: area_change
  - trigger: select.selection_changed
    target:
      label_id: light_schedule
    options: {}
    id: light_schedule_change
  conditions:
  - condition: template
    value_template: "{{ trigger.id in ['area_change', 'light_schedule_change'] or\n
      \  (trigger.event is defined and \n    trigger.event.data is defined and \n
      \   (trigger.event.data.action in ['create', 'remove'] or\n     (trigger.event.data.action
      == 'update' and \n      trigger.event.data.changes is defined and \n      (trigger.event.data.changes.labels
      is defined or \n       trigger.event.data.changes.area_id is defined)))) }}"
  actions:
  - variables:
      target_area: "{% if trigger.id == 'light_schedule_change' %}\n  {{ area_id(trigger.entity_id)
        | default('none') }}\n{% elif trigger.id == 'area_change' %}\n  {{ trigger.event.data.area_id
        | default('none') }}\n{% else %}\n  {% set data = trigger.event.data %}\n
        \ {% if data.area_id is defined and data.area_id is not none %}\n    {{ data.area_id
        }}\n  {% elif data.changes is defined and data.changes.area_id is defined
        and data.changes.area_id is not none %}\n    {{ data.changes.area_id }}\n
        \ {% elif trigger.id == 'entity_change' and data.entity_id is defined and
        area_id(data.entity_id) is not none %}\n    {{ area_id(data.entity_id) }}\n
        \ {% elif trigger.id == 'device_change' and data.device_id is defined and
        device_attr(data.device_id, 'area_id') is not none %}\n    {{ device_attr(data.device_id,
        'area_id') }}\n  {% else %}\n    none\n  {% endif %}\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set entity_id = trigger.event.data.entity_id %}

          {% set domain = entity_id.split(''.'')[0] %}

          {{ domain == ''scene'' }}'
      sequence:
      - variables:
          appId: scene
          discoveryPrefix: homeassistant
          target_select: select.{{ target_area }}_matrix_scene
          displayName: '{{ area_name(target_area) | default(target_area | replace(''_'',
            '' '') | title) }}'
          deviceObj:
            identifiers:
            - matrix_area_{{ target_area }}
            name: '{{ displayName }} Matrix'
            model: Universal Matrix Node
            manufacturer: Pico Cartographer
            suggested_area: '{{ displayName }}'
          scene_options: "{% set opt = state_attr('sensor.' ~ target_area ~ '_matrix_scene_config',
            'options') %} \n{% if opt is list and opt | count > 0 %}\n  {% set ns
            = namespace(cleaned=[]) %}\n  {% for item in opt %}\n    {% set ns.cleaned
            = ns.cleaned + [ item | replace(':', '') ] %}\n  {% endfor %}\n  {{ ns.cleaned
            }}\n{% else %}\n  {{ ['0 Off'] }}\n{% endif %}"
          zb_options: "{% set ns = namespace(found=[]) %}\n{%- set prefix = 'scene.'
            ~ target_area ~ '_' %}\n{%- for s in states.scene \n   | selectattr('entity_id',
            'search', '^' ~ prefix ~ '[0-9]*0_') -%}\n  {%- set suffix = s.entity_id
            | replace(prefix, '', 1) -%}\n  {%- set parts = suffix.split('_') -%}\n
            \ {%- set scene_id = parts[0] -%}\n  {%- set scene_name = parts[1:] |
            join(' ') | title -%}\n  {%- set ns.found = ns.found + [ scene_id ~ '
            ' ~ scene_name ] -%}\n{%- endfor -%}\n{{ ns.found | unique | sort }}"
          is_zigbee_scene: '{{ zb_options is list and zb_options | count > 0 }}'
          final_options: '{{ zb_options if is_zigbee_scene else scene_options }}'
          entity_id: "{% if trigger.id == 'entity_change' %}\n   {{ trigger.event.data.entity_id}}\n{%
            else %}\n  none\n{% endif %}"
      - action: logbook.log
        data:
          name: UCC CONVERGENCE
          message: Registry shift detected on [{{ entity_id }}]. Force-recalculating
            options for select.{{ target_area }}_matrix_scene.
          domain: select
      - action: mqtt.publish
        data:
          topic: '{{ discoveryPrefix }}/select/{{ target_area }}/{{ appId }}/config'
          payload: "{{ {\n  \"name\": \"Scene\",\n  \"unique_id\": \"matrix_\" ~ target_area
            ~ \"_\" ~ appId ~ \"_select\",\n  \"default_entity_id\": \"select.\" ~
            target_area ~ \"_matrix_\" ~ appId,\n  \"state_topic\": discoveryPrefix
            ~ \"/select/\" ~ target_area ~ \"/\" ~ appId ~ \"/state\",\n  \"value_template\":
            \"{{ value_json.sequence_weight ~ ' ' ~ value_json.name }}\",\n  \"command_topic\":
            \"home/universal/bus\",\n  \"command_template\": \"{\\\"action_type\\\":
            \\\"scene_cycle\\\", \\\"area_key\\\": \\\"\" ~ target_area ~ \"\\\",
            \\\"action_value\\\":  \\\"\" ~ value ~ \"\\\", \\\"source_device\\\":
            \\\"ha_ui_selector\\\"}\",\n  \"options\": final_options,\n  \"json_attributes_topic\":
            discoveryPrefix ~ \"/select/\" ~ target_area ~ \"/\" ~ appId ~ \"/attributes\",\n
            \ \"json_attributes_template\": \"{{ value_json | tojson }}\",\n  \"availability_topic\":
            discoveryPrefix ~ \"/select/\" ~ target_area ~ \"/\" ~ appId ~ \"/status\",\n
            \ \"payload_available\": \"online\",\n  \"payload_not_available\": \"offline\",\n
            \ \"availability_mode\": \"all\",\n  \"icon\": \"mdi:palette-swatch\"\n}
            | tojson }}"
          retain: true
        enabled: false
      - alias: Commit History Stack and Selector Metadata
        action: mqtt.publish
        data:
          topic: homeassistant/select/{{ target_area }}/scene/attributes
          retain: true
          payload: "{{ {\n  \"options\": final_options,\n  \"scene\": state_attr(target_select,
            'scene'),\n  \"friendly_name\": state_attr(target_select, 'friendly_name'),\n
            \ \"icon\": state_attr(target_select, 'icon'),\n  \"history_stack\": state_attr(target_select,
            'history_stack')\n} | tojson }}"
      alias: Scene Processing
    default:
    - condition: template
      value_template: '{{ target_area != ''none'' and target_area | length > 0 }}'
    - variables:
        postures:
        - morning
        - daylight
        - evening
        - night
        profile_sensor: sensor.{{ target_area }}_profile
        existing_profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
          }}'
        existing_sub_zones: '{{ state_attr(profile_sensor, ''sub_zones'') | default({},
          true) if existing_profile_exists else {} }}'
        existing_features: '{{ state_attr(profile_sensor, ''features'') | default({},
          true) if existing_profile_exists else {} }}'
        existing_eligible: '{{ existing_features.get(''sub_zones_eligible'', []) }}'
        live_policy_map: "{% set ns = namespace(map={}) %} \n{% for p in postures
          %}\n  {% set entity = 'select.' ~ target_area ~ '_profile_' ~ p %}\n  {%
          set state_val = states(entity) | default('manual', true) %}\n  {% set safe_val
          = 'presence' if state_val in ['unknown', 'unavailable'] else state_val %}\n
          \ {% set ns.map = dict(ns.map, **{p: safe_val}) %}\n{% endfor %} \n{{ ns.map
          }}"
        area_policies: '{{ labels(target_area) | default([], true) }}'
        all_area_entities: '{{ area_entities(target_area) }}'
        discovered_doors: "{% set ns = namespace(entities=[]) %} \n{% for e in all_area_entities
          if has_value(e) and 'door' in labels(e) %}\n  {% set ns.entities = ns.entities
          + [e] %}\n{% endfor %}\n    \n{{ ns.entities }}"
        discovered_fans: "{% set ns = namespace(entities=[]) %} \n{% for e in all_area_entities
          if has_value(e) and 'fan' in labels(e) %}\n  {% set ns.entities = ns.entities
          + [e] %}\n{% endfor %} \n\n{{ ns.entities }}"
        discovered_lights: "{% set ns = namespace(entities=[]) %} \n{% for e in all_area_entities
          if has_value(e) and 'main' in labels(e) %}\n  {% set ns.entities = ns.entities
          + [e] %}\n{% endfor %} \n\n{{ ns.entities }}"
        discovered_relays: "{% set ns = namespace(entities=[]) %} \n{% for e in all_area_entities
          if has_value(e) and 'relay' in labels(e) %}\n  {% set ns.entities = ns.entities
          + [e] %}\n{% endfor %} \n\n{{ ns.entities }}"
        discovered_presence: "{% set ns = namespace(entities=[]) %} \n{% for e in
          all_area_entities if has_value(e) and 'presence' in labels(e) %}\n  {% set
          ns.entities = ns.entities + [e] %}\n{% endfor %} \n\n{{ ns.entities }}"
        discovered_indicator: "{% set ns = namespace(entities=[]) %} \n{% for e in
          all_area_entities if has_value(e) and 'indicator' in labels(e) %}\n  {%
          set ns.entities = ns.entities + [e] %}\n{% endfor %} \n    \n{{ ns.entities
          }}\n    "
        compiled_profile: "{% set features = {\n  'scene_eligible': 'scene_eligible'
          in area_policies,\n  'lock_eligible': 'lock_eligible' in area_policies,\n
          \ 'area_override_eligible': 'area_override_eligible' in area_policies,\n
          \ 'night_light': 'night_light' in area_policies,\n  'bind_eligible': 'bind_eligible'
          in area_policies,\n  'sub_zones_eligible': existing_eligible\n} %} \n{%
          set topography = {\n  'light_entities': discovered_lights,\n  'door_entities':
          discovered_doors,\n  'fan_entities': discovered_fans,\n  'presence_entities':
          discovered_presence,\n  'indicator_entities': discovered_indicator,\n  'relay_entities':
          discovered_relays\n} %} \n{{ {\n  'area_id': target_area,\n  'policy_map':
          live_policy_map,\n  'sub_zones': existing_sub_zones,\n  'features': features,\n
          \ 'topography': topography\n} }}"
    - action: mqtt.publish
      data:
        topic: homeassistant/sensor/{{ target_area }}/profile/attributes
        payload: '{{ compiled_profile | to_json }}'
        retain: true
    - action: mqtt.publish
      data:
        topic: homeassistant/sensor/{{ target_area }}/profile/state
        payload: '{{ now().isoformat() }}'
        retain: true
  trace:
    stored_traces: 50
- id: '1780938638553'
  alias: Posture Override Reset V1
  description: "# SYSTEM: POSTURE OVERRIDE RESET (V1)\nCentral processing engine for
    house-wide posture transitions.\n## 1. PURPOSE\nGatekeeps non-automated state
    changes. It acts as the bridge between physical  hardware (Relays/Switches), environmental
    sensors (Night Light), and the  Global Presence Engine (GPE) registry.\n## 2.
    ARCHITECTURE\n\n  \n* **Sweep Engine**: Listens for posture changes to perform
    a 'Smart Purge' \n  of manual overrides when transitioning into restrictive modes
    (Night/Away).\n\n## 3. DEPENDENCIES\n* `alarm_control_panel.house_posture`: The
    master state machine for the matrix.\n* `label:override_eligible`: Required on
    entities to participate in Smart Purges."
  triggers:
  - trigger: state
    entity_id:
    - alarm_control_panel.house_posture_engine_house_posture
    id: posture_shift_trigger
    enabled: false
    to:
    - armed_night
    - armed_away
  - trigger: alarm_control_panel.armed_night
    target:
      label_id: home_posture
    options:
      behavior: each
  - trigger: alarm_control_panel.armed_away
    target:
      label_id: home_posture
    options:
      behavior: each
  conditions: []
  actions:
  - variables:
      new_state: "{{\n  label_entities('home_posture')  \n    | expand \n    | map(attribute='state')
        \n    | first\n    | default('none')\n}}"
      current_posture: '{{ trigger.to_state.state }}'
      posture_slug: "{% if new_state == 'armed_night' %}\n  night \n{% elif new_state
        in ['armed_away', 'armed_vacation'] %}\n  away \n{% else %} \n  default \n{%
        endif %}"
      active_lights: "{{\n  label_entities('override_eligible')  \n    | expand \n
        \   | selectattr('state', 'eq', 'on')  \n    | map(attribute='entity_id')
        \n    | list  \n}}"
  - repeat:
      for_each: '{{ active_lights }}'
      sequence:
      - event: area_registry_update
        event_data:
          action: add
          claimant_id: '{{ repeat.item }}'
          target:
            area_id: '{{ area_id(repeat.item) }}'
          intent_type: override
          seconds: 10
  mode: parallel
  max: 20
  trace:
    stored_traces: 90
- id: '1780970815917'
  alias: System - Sun Phase Change Orchestrator (V1)
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.schedule_posture
    to:
  conditions: []
  actions:
  - variables:
      current_posture: "{% set registry = state_attr('sensor.global_variable_registry',
        'vars')\n  | default({}, true) %}\n{% set g_env = registry.get('globals',
        {}).get('environmental', {}) %}\n\n{{ states(g_env.schedule_posture) | default('daylight',
        true) }}\n"
  - parallel:
    - repeat:
        for_each: '{{ areas() }}'
        sequence:
        - variables:
            target_area: '{{ repeat.item }}'
            profile_sensor: sensor.{{ target_area }}_profile
            profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
              }}'
            profile_policy_map: '{{ state_attr(profile_sensor, ''policy_map'') | default({},
              true) }}'
            profile_features: '{{ state_attr(profile_sensor, ''features'') | default({},
              true) }}'
            profile_posture: '{{ profile_policy_map.get(current_posture, ''none'')
              }}'
            use_scene: '{{ profile_features.get(''scene_eligible'', true) }}'
            previous_posture: '{{ profile_policy_map.get( trigger.from_state.state,
              ''daylight'' ) }}

              '
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ profile_posture == ''on'' and profile_posture!=
                previous_posture }}'
            sequence:
            - choose:
              - conditions:
                - alias: Area Uses Scenes
                  condition: template
                  value_template: '{{ use_scene }}'
                sequence:
                - event: universal_controller_command
                  event_data:
                    action_type: scene_cycle
                    target:
                      area_id: '{{ target_area }}'
                    action_value: restore
                    source_device: '{{ profile_sensor }}'
                  enabled: true
              - conditions:
                - alias: Not Area Uses Scenes
                  condition: template
                  value_template: '{{ not use_scene }}'
                sequence:
                - event: universal_controller_command
                  event_data:
                    action_type: light_call
                    command_input: turn_on
                    target:
                      area_id: '{{ target_area }}'
                      label_id:
                      - main
                    action_value: day_mode
                    metadata:
                      publish_intent: add
                      claimant_id: schedule_service
                      intent_type: schedule
                      seconds: -1
                    source_device: '{{ profile_sensor }}'
                  enabled: true
                - event: lighting_registry_update
                  event_data:
                    action: add
                    claimant_id: schedule_service
                    target:
                      area_id: '{{ target_area }}'
                    intent_type: schedule
                  enabled: false
              default:
              - event: lighting_registry_update
                event_data:
                  action: remove
                  claimant_id: schedule_service
                  target:
                    area_id: '{{ target_area }}'
                  intent_type: schedule
            alias: Profile Posture is On
          - conditions:
            - condition: template
              value_template: '{{ profile_posture in [''off''] and profile_posture!=
                previous_posture }}'
            sequence:
            - event: lighting_registry_update
              event_data:
                action: add
                claimant_id: schedule_service
                target:
                  area_id: '{{ target_area }}'
                intent_type: schedule
                seconds: 0
            alias: Profile Posture is Off
          - conditions:
            - condition: template
              value_template: '{{ profile_posture in [''presence''] and profile_posture
                != previous_posture }}'
            sequence:
            - event: lighting_registry_update
              event_data:
                action: add
                claimant_id: schedule_service
                target:
                  area_id: '{{ target_area }}'
                intent_type: motion
                seconds: 120
            alias: Profile Posture is Presence
          default:
          - condition: template
            value_template: '{{ profile_posture != previous_posture }}'
          - event: lighting_registry_update
            event_data:
              action: remove
              claimant_id: schedule_service
              target:
                area_id: '{{ target_area }}'
              intent_type: schedule
    - choose:
      - conditions:
        - condition: state
          entity_id: sensor.schedule_posture
          state: night
        sequence:
        - action: alarm_control_panel.alarm_arm_night
          target:
            entity_id: alarm_control_panel.house_posture_engine_house_posture
          data: {}
      - conditions:
        - condition: state
          entity_id: alarm_control_panel.house_posture_engine_house_posture
          state:
          - armed_night
        sequence:
        - action: alarm_control_panel.alarm_disarm
          target:
            entity_id: alarm_control_panel.house_posture_engine_house_posture
          data: {}
  mode: single
  trace:
    stored_traces: 50
- id: '1781103264536'
  alias: Override - Unified Gateway V5.0
  description: "# SYSTEM: OVERRIDE GATEWAY (V5.0)\n\nCentral processing engine for
    manual overrides events.\n\n## 1. PURPOSE\n\nGatekeeps non-automated state changes.
    It acts as the bridge between physical \nhardware (Relays/Switches), environmental
    sensors (Night Light), and the \nGlobal Presence Engine (GPE) registry.\n\n##
    2. ARCHITECTURE\n\n* **Override Branch**: Monitors `sensor.active_override_source`
    to translate \n  physical toggles into 'Override' intents within the lighting
    registry.\n  \n\n## 3. DEPENDENCIES\n\n* `sensor.active_override_source`: Unified
    stream of physical relay events.\n\n* `light.hallway_front_main`: Physical relay
    events.\n"
  triggers:
  - trigger: state
    entity_id: light.hallway_front_main
    attribute: brightness
    id: Front Change
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/+
      payload: toggle
      value_template: '{{ value_json.action if value_json.action is defined else ''''
        }}

        '
    id: Zigbee_id
    enabled: true
  - trigger: light.turned_off
    target:
      label_id: override_eligible
    options:
      behavior: each
    id: Override_id
  - trigger: light.turned_on
    target:
      label_id: override_eligible
    options:
      behavior: each
    id: Override_id
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: light_call
      command_input: turn_off
      source_device: pico
      metadata:
        action: remove
    id: Pico_Clear_id
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Override_id
      sequence:
      - variables:
          source_entity: '{{ trigger.entity_id }}

            '
          current_state: '{{ states(source_entity) }}'
          area_key: '{{ area_id(source_entity) | default(''none'') }}'
          entity_labels: '{{ labels(source_entity) }}'
          action_type: lighting_registry_update
          action_value: '{{ states[source_entity].state }}'
          action: add
          claimant_id: '{{ source_entity }}'
          intent_type: override
          seconds: '{{ -1 if is_state(source_entity, ''on'') else 0 }}'
          source_device: manual_action
      - if:
        - condition: template
          value_template: '{{ trigger.to_state.context.parent_id is none and trigger.to_state.context.user_id
            is none }}'
        then:
        - event: lighting_registry_update
          event_data:
            action: '{{ action }}'
            action_type: '{{ action_type }}'
            claimant_id: '{{ claimant_id }}'
            intent_type: '{{ intent_type }}'
            target:
              area_id: '{{ area_key }}'
            seconds: '{{ seconds }}'
            source_device: '{{ source_device }}'
          enabled: true
        - action: logbook.log
          metadata: {}
          data:
            name: Lighting Override Engine
            message: 'Override for {{ area_key }} State: {{ states[source_entity].state
              }} '
            entity_id: '{{ source_entity }}'
    - conditions:
      - condition: trigger
        id:
        - Front Change
      sequence:
      - variables:
          target_state: '{{ states(''light.hallway_front_main'') }}'
          action_value: '{% if target_state == ''off'' %} 0 {% else %} {{ state_attr(''light.hallway_front_main'',
            ''brightness'') | int(255) }} {% endif %}

            '
          command_input: turn_{{ target_state }}
      - alias: Emit Intent Event
        event: universal_controller_command
        event_data:
          source_device: physical_switch_hallway
          action_type: light_call
          action_value: '{{ action_value }}'
          command_input: '{{ command_input }}'
          target:
            area_id: hallway
            label_id:
            - Front
          metadata:
            claimant_id: '{{ device_id( trigger.entity_id ) }}'
            seconds: '{{ -1 if command_input == ''turn_on'' else 0 }}'
            action: '{{ ''add'' if command_input == ''turn_on'' else ''remove'' }}'
            intent_type: override
      - data:
          name: UCC_SENT
          message: 'Area: {{area_name(trigger.entity_id)}} | Action: light_call |
            Value: "{{ action_value }} | Label: Front | {{ trigger.entity_id }}'
          entity_id: sensor.ucc_registry_log
        action: logbook.log
      - alias: Ignore the Ramp Noise
        delay:
          seconds: 1.5
    - conditions:
      - condition: trigger
        id:
        - Zigbee_id
      sequence:
      - variables:
          payload: '{{ trigger.payload_json }}'
          device_name: '{{ trigger.topic.split(''/'')[1] }}'
          target_area: '{{ area_id(''sensor.'' ~ device_name | slugify ~ ''_action'')
            | default(''none'') }}'
          profile_sensor: sensor.{{ target_area }}_profile
          profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
            }}'
          profile_topography: '{{ state_attr(profile_sensor, ''topography'') | default({},
            true) }}'
          profile_policy_map: '{{ state_attr(profile_sensor, ''policy_map'') | default({},
            true) }}'
          profile_features: '{{ state_attr(profile_sensor, ''features'') | default({},
            true) }}'
          is_bind_eligible: '{{ profile_features.get(''bind_eligible'', false) }}'
          use_scene: '{{ profile_features.get(''scene_eligible'', false) }}'
          target_light: "{{ label_entities('main') \n   | select('match', 'light\\.')\n
            \  | select('in', area_entities(target_area)) \n   | first | default('none')
            }}\n"
          intended_command: '{{ ''turn_off'' if is_state(target_light, ''on'') else
            ''turn_on'' }}'
          continue: '{{ is_bind_eligible and target_light | count > 0 }}'
          use_night_settings: "{% set registry = state_attr('sensor.global_variable_registry',
            'vars') \n   | default({}, true) %}\n{% set g_env = registry.get('globals',
            {}).get('environmental', {}) %}\n\n{{\n  profile_features.get('night_light',
            false) and is_state(g_env.night_posture_sensor, 'on') \n}}\n"
      - condition: template
        value_template: "{{ continue }}\n   "
      - if:
        - condition: template
          value_template: '{{ not use_scene }}'
        then:
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: z2m_physical_rocker
            action_type: light_call
            action_value: '{{ ''night_mode'' if use_night_settings else ''day_mode''
              }}'
            command_input: '{{ intended_command }}'
            target:
              area_id: '{{ target_area }}'
              label_id:
              - main
            data_payload: '{{ payload }}'
            metadata:
              claimant_id: '{{ device_name }}'
              seconds: '{{ -1 if intended_command == ''turn_on'' else 0 }}'
              action: '{{ ''add'' if intended_command == ''turn_on'' else ''remove''
                }}'
              intent_type: override
            overrides: {}
        else:
        - event: universal_controller_command
          event_data:
            action_type: scene_cycle
            target:
              area_id: '{{ target_area }}'
            action_value: restore
            source_device: '{{ device_name }}'
            metadata:
              claimant_id: '{{ device_name }}'
              action: remove
              intent_type: override
      - data:
          name: UCC_SENT
          message: 'Area: {{ target_area }} | Action: light_call | Value: {{ target_light
            }}'
          entity_id: sensor.ucc_registry_log
        action: logbook.log
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 250
    - conditions:
      - condition: trigger
        id:
        - Pico_Clear_id
      sequence:
      - variables:
          payload: '{{ trigger.event.data }}'
          target_area: '{{ payload.target.area_id }}'
          claimant_id: '{{ payload.metadata.claimant_id | default(payload.source_device)
            }}'
      - alias: Emit Manual Clearance to Ledger
        event: lighting_registry_update
        event_data:
          action: remove
          action_type: lighting_registry_update
          claimant_id: '{{ claimant_id }}'
          intent_type: override
          target:
            area_id: '{{ target_area }}'
          seconds: 0
          source_device: '{{ payload.source_device }}'
          metadata:
            mode: manual_clearance
            session_id: '{{ payload.metadata.session_id | default(''none'') }}'
      - action: logbook.log
        data:
          name: Lighting Override Engine
          message: 'Manual clearance event captured via Unified Gateway for Area:
            {{ target_area }}'
          entity_id: sensor.ucc_registry_log
    enabled: true
  mode: single
  trace:
    stored_traces: 50
