system_update_area_sub_zone_layout_2:
  alias: System - Tune Sub-Zone Policy
  description: Declaratively updates sub-zone eligibility and maps sparse policy overrides.
  fields:
    target_area:
      name: Target Area
      required: true
      selector:
        area: {}
    target_sub_zone:
      name: Sub-Zone to Tune
      required: true
      default: '{{ sub_zones[0] if sub_zones is defined and sub_zones | length > 0
        else none }}'
      selector:
        select:
          options:
          - counter
          - island
          - table
    target_posture:
      name: Target Posture
      description: Which posture does this override apply to?
      required: false
      selector:
        select:
          options:
          - morning
          - daylight
          - evening
          - night
      default: daylight
    assigned_policy:
      name: Assigned Policy Override
      description: Select the policy behavior for this sub-zone during the chosen
        posture.
      required: false
      selector:
        select:
          options:
          - label: None (Follow Backstop)
            value: none
          - label: Presence
            value: presence
          - label: 'On'
            value: 'on'
          - label: 'Off'
            value: 'off'
      default: none
  sequence:
  - variables:
      profile_sensor: sensor.{{ target_area }}_profile
      zone_key: '{{ target_sub_zone | string | lower }}'
      posture_key: '{{ target_posture | string | lower }}'
      policy_val: '{{ assigned_policy | string | lower }}'
      current_sub_zones: '{{ state_attr(profile_sensor, ''sub_zones'') | default({},
        true) }}'
      has_valid_input: '{{ zone_key not in [''none'', ''''] and posture_key not in
        [''none'', ''''] }}'
      updated_sub_zones: "{% if not has_valid_input %}\n  {{ current_sub_zones }}\n{%
        else %}\n  {% set zone_data = current_sub_zones.get(zone_key, {}) %}\n  {%
        set p_map = zone_data.get('policy_map', {}) %}\n  \n  {# Rebuild the policy
        map, dropping or adding keys using a native loop #}\n  {% set ns_p = namespace(map={})
        %}\n  {% for pk, pv in p_map.items() if pk != posture_key %}\n    {% set ns_p.map
        = dict(ns_p.map, **{pk: pv}) %}\n  {% endfor %}\n  {% if policy_val != 'none'
        %}\n    {% set ns_p.map = dict(ns_p.map, **{posture_key: policy_val}) %}\n
        \ {% endif %}\n  \n  {# Rebuild the master sub_zones dictionary #}\n  {% set
        ns_z = namespace(zones={}) %}\n  {% for zk, zv in current_sub_zones.items()
        if zk != zone_key %}\n    {% set ns_z.zones = dict(ns_z.zones, **{zk: zv})
        %}\n  {% endfor %}\n  \n  {# Only re-inject the zone if its policy map has
        remaining active elements #}\n  {% if ns_p.map | length > 0 %}\n    {% set
        ns_z.zones = dict(ns_z.zones, **{zone_key: {'policy_map': ns_p.map}}) %}\n
        \ {% endif %}\n  \n  {{ ns_z.zones }}\n{% endif %}"
      compiled_profile: "{{ {\n  'area_id': target_area,\n  'policy_map': state_attr(profile_sensor,
        'policy_map') | default({}, true),\n  'sub_zones': updated_sub_zones,\n  'features':
        state_attr(profile_sensor, 'features') | default({}, true),\n  'topography':
        state_attr(profile_sensor, 'topography') | default({}, true)\n} }}"
  - action: mqtt.publish
    data:
      topic: homeassistant/sensor/{{ target_area }}/profile/attributes
      payload: '{{ compiled_profile | to_json }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: homeassistant/sensor/{{ target_area }}/profile/state
      payload: '{{ now().isoformat() }}'
      retain: true
discovery_v5_5:
