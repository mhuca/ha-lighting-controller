- id: "1771474376945"
  alias: Light Call - Turn On
  description: ""
  triggers:
    - trigger: event
      id: UCC_Event
      event_type: universal_controller_command
      event_data:
        action_type: light_call
        command_input: turn_on
      enabled: true
    - trigger: event
      id: eUCC_Event
      event_type: esphome.universal_controller_command
      event_data:
        action_type: light_call
        command_input: turn_on
      enabled: true
    - trigger: mqtt
      id: MQTT_Message
      options:
        topic: home/universal/bus
        payload: light_call
        value_template: "{{ value_json.action_type }}"
  conditions: []
  actions:
    - alias: Intent and Context
      variables:
        registry: "{{ state_attr('sensor.global_variable_registry', 'vars') }}"
        g_logic: "{{ registry.globals.logic_engines }}"
        target_kelvin: "{{ states(g_logic.cct_calculation) | int(3200) }}"
        target_br_dimmer: "{{ states(g_logic.brightness_calculation) | int(255) }}"
        log_dest: "{{ g_logic.system_log }}"
        payload:
          "{{ trigger.payload if trigger.id == 'MQTT_Message' else trigger.event.data
          }}"
        action_val: "{{ payload.action_value | default('') }}"
        area_key: "{{ payload.area_key }}"
        val: "{{ payload.target_label | default([], true) }}"
        target_labels:
          "{{ ( [val] if val is string else val) \n  | map('label_entities')
          \n  | sum(start=[]) \n  | unique \n  | list \n}}\n"
    - alias: Data Constants
      variables:
        dim_factor: 20
        command_map:
          max:
            brightness: 255
          raise:
            brightness_step: 35
          lower:
            brightness_step: -35
          min:
            brightness: 25
          night_mode:
            brightness: 25
          day_mode:
            brightness: 190
          release:
            brightness_step: 0
        payload: {}
    - alias: Hardware Bucketing and Target Expansion (The "Engine")
      variables:
        area_lights: "{{ area_entities(area_key) | select('match', 'light.*') |
          list }}"
        target_entities:
          "{% if target_labels | length > 0 %}\n    {{ area_lights |
          intersect(target_labels) }}\n  {% else %}\n    {{ area_lights }}\n  {% endif
          %}\n"
        target_br:
          "{% set current_cmd = command_map.get(action_val, {}) %} {% if 'brightness_step'
          in current_cmd %}\n  {{ 255 if current_cmd.brightness_step > 0 else 1 }}\n{%
          elif action_val is number or (action_val | is_number) %}\n  {{ ([0, action_val
          | int, 255] | sort)[1] }}\n{% else %}\n  {{ current_cmd.get('brightness',
          190) }}\n{% endif %}\n"
        step_val: "{{ command_map.get(action_val, {}).get('brightness_step', 0) }}"
        ikea_cct_lights:
          "{% set ns = namespace(to_update=[]) %} \n{% for l in states.light
          \n  | selectattr('entity_id', 'in', target_entities) \n    if l.attributes.get('max_color_temp_kelvin',
          0) | int <= 4000 \n   and 'color_temp' in l.attributes.get('supported_color_modes',
          []) %}\n      {% set cur_k = l.attributes.get('color_temp_kelvin', 0) | int(0)
          %}\n      {% set cur_br = l.attributes.get('brightness', 0) | int(0) %}\n
          \     {% set clamped_k = ([l.attributes.get('min_color_temp_kelvin', 2202)
          | int, target_kelvin, 4000] | sort)[1] %}\n      {% if (cur_k - clamped_k)
          | abs > 50 or (cur_br - target_br) | abs > 3 %}\n        {% set ns.to_update
          = ns.to_update + [l.entity_id] %}\n      {% endif %}\n{% endfor %} {{ ns.to_update
          }}\n"
        standard_cct_lights:
          "{% set ns = namespace(to_update=[]) %} {% for l in states.light
          | selectattr('entity_id', 'in', target_entities) \n   if l.entity_id not in
          ikea_cct_lights\n   and 'color_temp' in l.attributes.get('supported_color_modes',
          []) %}\n  {% set cur_k = l.attributes.get('color_temp_kelvin', 0) | int(0)
          %}\n  {% set cur_br = l.attributes.get('brightness', 0) | int(0) %}\n  {%
          set min_hw = l.attributes.get('min_color_temp_kelvin', 2200) | int %}\n  {%
          set max_hw = l.attributes.get('max_color_temp_kelvin', 7000) | int %}\n  {%
          set clamped_k = ([min_hw, target_kelvin, max_hw] | sort)[1] %}\n  {% if (cur_k
          - clamped_k) | abs > 50 or (cur_br - target_br) | abs > 3 %}\n    {% set ns.to_update
          = ns.to_update + [l.entity_id] %}\n  {% endif %}\n{% endfor %} {{ ns.to_update
          }}\n"
        dimmer_lights:
          "{{ target_entities \n  | intersect(label_entities('CurrentCTDimmer'))
          \n  | list }}\n"
        binary_lights:
          "{% set all_binary_lights = states.light \n    | selectattr('attributes.supported_color_modes',
          'defined')\n    | selectattr('attributes.supported_color_modes', 'eq', ['onoff'])\n
          \   | map(attribute='entity_id') | list %}\n{{ target_entities | intersect(all_binary_lights)
          }}\n"
        excluded:
          "{{ ikea_cct_lights + standard_cct_lights + dimmer_lights + binary_lights
          | list | default([]) }}"
        standard_lights:
          "{{ target_entities \n  | reject('in', excluded ) \n  | list
          }}\n"
    - parallel:
        - alias: IKEA CCT Turn On
          if:
            - condition: template
              value_template: "{{ ikea_cct_lights | length > 0 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ ikea_cct_lights }}"
              data: "{% set base_data = {'color_temp_kelvin': target_kelvin} %}

                {{ dict(base_data, brightness_step=step_val) if step_val != 0 else dict(base_data,
                brightness=target_br) }}

                "
        - alias: Standard CCT Turn On
          if:
            - condition: template
              value_template: "{{ standard_cct_lights | length > 0 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ standard_cct_lights }}"
              data:
                "{% set base_data = {'color_temp_kelvin': target_kelvin} %} {{ dict(base_data,
                brightness_step=step_val) if step_val != 0 else dict(base_data, brightness=target_br)
                }}

                "
        - alias: Dimmer Lights Turn On
          if:
            - condition: template
              value_template: "{{ dimmer_lights | length > 0 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ dimmer_lights }}"
              data:
                brightness: "{{ target_br_dimmer | int(150) }}"
        - alias: Binary Lights Turn On
          if:
            - condition: template
              value_template: "{{ binary_lights | length > 0 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ binary_lights }}"
              data: {}
        - alias: Standard Lights Turn On
          if:
            - condition: template
              value_template: "{{ standard_lights | length > 0 }}"
          then:
            - action: light.turn_on
              target:
                entity_id: "{{ standard_lights }}"
              data: "{% set base_data = {} %}

                {{ dict(base_data, brightness_step=step_val) if step_val != 0 else dict(base_data,
                brightness=target_br) }}

                "
    - action: logbook.log
      data:
        name: Light Engine (On)
        message:
          "Light Call Source: {{ payload.source_device | default('') }} | Area:
          {{ area_key }} | Label: {{ val[0] | default('All') }} | color_temp_kelvin:
          {{ target_kelvin }} {{this.entity_id}}"
        entity_id: "{{ log_dest }}"
  mode: queued
  max: 20
- id: "1771475160937"
  alias: Light Call - Turn Off
  description: ""
  triggers:
    - trigger: event
      id: UCC_Event
      event_type: universal_controller_command
      event_data:
        action_type: light_call
        command_input: turn_off
      enabled: true
    - trigger: event
      id: eUCC_Event
      event_type: esphome.universal_controller_command
      event_data:
        action_type: light_call
        command_input: turn_off
      enabled: true
    - trigger: mqtt
      id: MQTT_Message
      options:
        topic: home/universal/bus
        payload: light_call
        value_template: "{{ value_json.action_type }}"
  conditions: []
  actions:
    - alias: Define Actions
      variables:
        payload:
          "{{ trigger.payload if trigger.id == 'MQTT_Message' else trigger.event.data
          }}"
        area_key: "{{ payload.area_key }}"
        command: "{{ payload.command_input }}"
        action_type: "{{ payload.action_type }}"
        action_value: "{{ payload.action_value }}"
    - variables:
        transition: 0.2
        labels: "{{ trigger.event.data.target_label \n  | lower \n  | default([], true)\n}}\n"
        target_labels:
          "{{ ( [labels] if labels is string else labels ) \n  | map('label_entities')
          \n  | sum(start=[]) \n  | unique \n  | list \n}}\n"
        is_whole_area: "{{ labels | length == 0 }}"
        area_lights: "{{ area_entities(area_key) | select('match', 'light.*') |
          list }}"
        expanded_targets:
          "{{ area_lights | intersect(target_labels) if target_labels
          | length > 0 else area_lights }}

          "
        final_targets:
          "{{ states.light \n  | selectattr('entity_id', 'in', expanded_targets)
          \n  | rejectattr('state', 'eq', 'off') \n  | map(attribute='entity_id') \n
          \ | list }}\n"
        final_target_data:
          "{% if is_whole_area %}\n  {{ {\"area_id\": area_key} }}\n{%
          else %}\n  {{ {\"entity_id\": final_targets} }}\n{% endif %}\n"
        log_nominee:
          "{% if final_targets | length > 0 %}\n  {{ final_targets | first
          }}\n{% else %}\n  {% set main_light = area_lights | intersect(label_entities('main'))
          | first | default('none') %}\n  {{ main_light if main_light != 'none' else
          (area_lights | first | default('sensor.ucc_registry_log')) }}\n{% endif %}\n"
        telemetry: "{% set t_id = trigger.id | default('Event') %}

          {% set src = payload.source_device | default('unknown') %}

          [ID: {{ t_id }} | Src: {{ src }} | Val: {{ action_value | default('none')
          }}]

          "
    - if:
        - condition: template
          value_template:
            "{{ final_target_data.area_id is defined or (final_target_data.entity_id
            is defined and final_target_data.entity_id | length > 0) }}"
      then:
        - action: light.turn_off
          target: "{{ final_target_data }}"
          data: {}
        - action: logbook.log
          data:
            name: Light Engine (Off)
            message:
              "Turned off {{ final_targets | length }} lights in {{ area_key }}.
              (Source: {{ payload.source_device | default('') }}) {{this.entity_id}}
              {{ telemetry }}"
            entity_id: sensor.ucc_registry_log
        - action: logbook.log
          data:
            name: Light Engine (Off)
            message:
              "Turned off {{ final_targets | length }} lights in {{ area_key }}.
              (Source: {{ payload.source_device | default('') }}) {{this.entity_id}}
              {{ telemetry }}"
            entity_id: "{{ log_nominee }}"
      else:
        - alias: Silent Skip
          stop: All target lights are already off. Mesh silenced.
  mode: queued
  max: 20
- id: "1771475504554"
  alias: Command - Light Scene Cycle
  description: Handles scene rotation using Raise/Lower/Max/Min/Next
  triggers:
    - trigger: event
      id: UCC_Event
      event_type: universal_controller_command
      event_data:
        action_type: scene_cycle
    - trigger: mqtt
      id: MQTT_Message
      options:
        topic: home/universal/bus
        payload: scene_cycle
        value_template: "{{ value_json.action_type }}"
  actions:
    - variables:
        payload:
          "{{ trigger.payload if trigger.id == 'MQTT_Message' else trigger.event.data
          }}"
        area_key: "{{ payload.area_key }}"
        command_input: "{{ payload.command_input }}"
        intent:
          "{% if command_input == 'turn_off' %}\n  off\n{% elif payload.action_value
          == '' %}\n  max\n{% else %}\n  {{ payload.action_value }}\n{% endif %}\n"
        options:
          "{{ states.script \n   | selectattr('entity_id', 'in', area_entities(area_key))\n
          \  | selectattr('entity_id', 'in', label_entities('lighting'))\n   | map(attribute='entity_id')
          | list | sort }}\n"
        state_topic: home/lighting/{{ area_key }}/current_scene
        all_states:
          "{{ state_attr('sensor.mqtt_scene_tracker', 'data') | default({},
          true) }}"
        current_state_obj:
          "{{ all_states.get(area_key, {'state': options[0], 'last_changed':
          as_datetime(0).isoformat()}) }}"
        current_script: "{{ current_state_obj.state }}"
        last_changed: "{{ current_state_obj.last_changed }}"
        current_idx:
          "{{ options.index(current_script) if current_script in options
          else -1 }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ intent == 'max' }}"
          sequence:
            - variables:
                idx: "{{ -1 | int }}"
          alias: Maximum - Max
        - conditions:
            - condition: template
              value_template: "{{ intent in ['next', 'raise'] }}"
          sequence:
            - variables:
                idx:
                  "{{ -1 if current_idx >= (options | length - 1) else current_idx +
                  1 }}"
          alias: Next - Raise
        - conditions:
            - condition: template
              value_template: "{{ intent in ['lower','previous'] }}"
          sequence:
            - variables:
                idx: "{{ 0 if current_idx <= 0 else current_idx - 1 }}"
          alias: Previous - Lower
        - conditions:
            - condition: template
              value_template: "{{ intent == 'min' }}"
          sequence:
            - variables:
                idx: "{{ 1 | int }}"
          alias: Minimum -  Min
        - conditions:
            - condition: template
              value_template: "{{ intent == 'off' }}"
          sequence:
            - variables:
                idx: "{{ 0 | int }}"
          alias: "Off"
      default:
        - variables:
            idx: "{{ 1 | int }}"
    - action: script.turn_on
      target:
        entity_id: "{{ options[idx] }}"
      data: {}
    - action: mqtt.publish
      data:
        topic: "{{ state_topic }}"
        payload:
          "{{ {\n  \"state\": options[idx],\n  \"last_changed\": now().isoformat()\n}
          | to_json }}"
        retain: true
    - action: logbook.log
      data:
        name: Light Scene
        message:
          "Light Scene: {{ options[idx]}} by: {{ payload.source_device }} | Area:
          {{ area_key }}"
        entity_id: sensor.ucc_registry_log
    - if:
        - condition: template
          value_template: "{{ current_idx != idx }}"
      then: []
  mode: parallel
- id: "1771586583381"
  alias: Lutron Pico - Pico Registry Update
  description: this is to be removed
  triggers:
    - trigger: event
      event_type: lutron_caseta_button_event
      event_data:
        action: press
  conditions:
    - condition: template
      value_template: "{{ not is_owned or is_expired }}"
  actions:
    - event: lutron_button_event
      event_data:
        device_id: "{{ device_id }}"
        isOwned: true
        owned_ts: "{{ as_timestamp(trigger.event.time_fired) }}"
    - variables:
        device_id: "{{ trigger.event.data.device_id | default('none') }}"
        session_id: "{{ trigger.event.context.id | default('none') }}"
        button_type: "{{ trigger.event.data.button_type | default('unknown') }}"
        target_device_name:
          "{{ trigger.event.data.device_name \n  | lower \n  | replace('
          ','_') \n  | regex_replace(find='\\\\d+', replace='') \n  | default('unknown')
          }}\n"
        serial: "{{ trigger.event.data.serial | default(0) }}"
        sensor_entity: sensor.pico_config_{{ serial | string }}
        isCommission:
          "{{ has_value(sensor_entity) and state_attr(sensor_entity, 'config')
          not in [none, '', 'unknown'] }}"
        target_label:
          "{{ [] if target_device_name == 'remote' else [target_device_name]
          }}"
        button_number: "{{ trigger.event.data.button_number | default(0) }}"
        command_map:
          "{% set entity = sensor_entity | default('none') %} {{ state_attr(entity,
          'config') }}

          "
    - if:
        - condition: template
          value_template: "{{ isCommission }}"
      then:
        - alias: Wait for first Release Event... If None After 450ms then it's Hold
          wait_for_trigger:
            - event_type: lutron_caseta_button_event
              event_data:
                serial: "{{ serial | default(0) }}"
                device_id: "{{ device_id }}"
                button_number: "{{ button_number | default(0) }}"
                action: release
              id: release_event
              trigger: event
          timeout:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 500
          continue_on_timeout: true
        - variables:
            is_hold: "{{ wait.trigger is none }}"
        - if:
            - condition: template
              value_template: "{{ not is_hold }}"
          then:
            - wait_for_trigger:
                - event_type: lutron_caseta_button_event
                  event_data:
                    serial: "{{ serial | default(0) }}"
                    button_number: "{{ button_number | default(0) }}"
                    action: press
                  id: press_event
                  trigger: event
              timeout:
                milliseconds: 250
              continue_on_timeout: true
              alias: Wait For Second Press
            - variables:
                is_double: "{{ wait.trigger is not none }}"
            - if:
                - condition: template
                  value_template: "{{ is_double }}"
              then:
                - variables:
                    command: double
                  alias: Dedicated Double Variables
              else:
                - variables:
                    command: press
                  alias: Dedicated Press Variables
          else:
            - variables:
                command: hold
                command_type:
                  "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
                  ', '') \n  | replace('_', '') }}_{{ command }}\n"
                action_map: "{{ command_map.get(command,{}) }}"
                cmd: "{{ action_map.get(button_number | string , {}) }}"
              alias: Dedicated Hold Variables
            - variables:
                repeat_delay: "{{ 125 if cmd.type == 'media_call' else 500 }}"
                max_hold_time: 9
                max_iterations: "{{ (max_hold_time / (repeat_delay / 1000)) | round(0) }}"
              alias: Dedicated Repeat Variables
            - repeat:
                until:
                  - condition: template
                    value_template:
                      "{{ wait.trigger is not none or repeat.index > max_iterations
                      }}"
                sequence:
                  - alias: Hold Event
                    event: universal_controller_command
                    event_data:
                      source_device: pico
                      action_type: "{{ cmd.type | default(none) }}"
                      action_value: "{{ cmd.value | default(none) }}"
                      command_input: "{{ cmd.action | default(none) }}"
                      area_key: "{{ area_id(device_id) | default(none) }}"
                      target_label: "{{ target_label }}"
                      session_id: "{{ session_id }}"
                      data_payload: "{{ trigger.event.data }}"
                      overrides: "{}"
                      command: "{{ command }}"
                      command_type: "{{ command_type }}"
                    enabled: true
                  - wait_for_trigger:
                      - event_type: lutron_caseta_button_event
                        event_data:
                          serial: "{{ serial | default(0) }}"
                          device_id: "{{ device_id }}"
                          button_number: "{{ button_number | default(0) }}"
                          action: release
                        trigger: event
                    timeout:
                      hours: 0
                      minutes: 0
                      seconds: 0
                      milliseconds: "{{ repeat_delay | int }}"
                    continue_on_timeout: true
                  - variables:
                      is_hold: "{{ wait.trigger is none }}"
                      hold_duration:
                        "{% set end = as_timestamp(wait.trigger.event.time_fired)
                        if wait.trigger is not none else as_timestamp(now()) %} {{ (end -
                        start_ts) | round(3) }}

                        "
              enabled: true
            - variables:
                command: release
        - variables:
            command_type:
              "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
              ', '') \n  | replace('_', '') }}_{{ command }}\n"
            action_map: "{{ command_map.get(command,{}) }}"
            cmd: "{{ action_map.get(button_number | string , none ) }}"
      else:
        - variables:
            cmd:
              type: pico_commission
              value: ""
              action: broadcast
    - if:
        - condition: template
          value_template: "{{ cmd is not none }}"
      then:
        - alias: Press Event
          event: universal_controller_command
          event_data:
            source_device: pico
            action_type: "{{ cmd.type | default(none) }}"
            action_value: "{{ cmd.value | default(none) }}"
            command_input: "{{ cmd.action | default(none) }}"
            area_key: "{{ area_id(device_id) | default(none) }}"
            target_label: "{{ target_label }}"
            session_id: "{{ session_id }}"
            data_payload: "{{ trigger.event.data }}"
            overrides: "{}"
            command: "{{ command }}"
            command_type: "{{ command_type }}"
          enabled: true
        - action: logbook.log
          data:
            name: UCC_SENT
            message:
              "Area: {{ area_id(device_id) | default(none) }} | Action: {{cmd.type
              | default('') }} | Value: {{cmd.value | default('') }} | Label: {{ target_label[0]
              }} | Config: {{sensor_entity | default('') }}"
            entity_id: sensor.ucc_registry_log
    - event: lutron_button_event
      event_data:
        device_id: "{{ device_id }}"
        isOwned: false
        owned_ts: "{{ as_timestamp(now()) }}"
  mode: parallel
  variables:
    session_id: "{{ trigger.event.context.id }}"
    sessions:
      "{{ state_attr('sensor.pico_registry', 'active_sessions') | default({})
      }}"
    device_id: "{{ trigger.event.data.device_id | default('none') }}"
    session: "{{ sessions.get(device_id, {}) }}"
    is_owned: "{{ session.isOwned | default(false) }}"
    start_ts:
      "{{ as_timestamp(trigger.event.time_fired) | default(as_timestamp(now()))
      }}"
    is_expired: "{{start_ts >= (session.expiry | default(0)) }}"
  max: 10
