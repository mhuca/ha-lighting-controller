      event_data:
        source_device: light
        action_type: light_call
        action_value: ''
        command_input: turn_off
        target:
          area_id: mark_office
          label_id: []
        data_payload: '{{ trigger }}'
        overrides: {}
  - event: universal_controller_command
    event_data:
      action_type: light_override
      area_key: mud_room
      command_input: 'off'
      data_payload: '{{ trigger.to_state }}'
    alias: Reset Mud Room Lights Override
    enabled: false
  - event: universal_controller_command
    event_data:
      action_type: light_override
      area_key: garage
      command_input: 'off'
      data_payload: '{{ trigger.to_state }}'
    alias: Reset Garage Lights Override
    enabled: false
  - repeat:
      for_each: '{{ sweep_areas }}'
      sequence:
      - event: universal_controller_command
        event_data:
          source_device: light_out
          action_type: light_call
          action_value: ''
          target:
            area_id: '{{ repeat.item }}'
            label_id: []
          command_input: turn_off
  - repeat:
      for_each: '{{ precision_areas }}'
      sequence:
      - event: universal_controller_command
        event_data:
          source_device: light_out
          action_type: light_call
          action_value: ''
          target:
            area_id: '{{ repeat.item }}'
            label_id:
            - Lights Off
          command_input: turn_off
  - repeat:
      for_each: '{{ rooms }}'
      sequence:
      - alias: Turn Off Living Room Main Lights
        event: universal_controller_command
        event_data:
          source_device: light
          action_type: light_call
          action_value: ''
          area_key: '{{ repeat.item.split(''@'')[0] }}'
          command_input: turn_off
          target_label: '{{ repeat.item.split(''@'')[1:] }}'
          data_payload: '{{ trigger }}'
