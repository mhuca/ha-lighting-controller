        area_id: '{{ area_key }}'
      data_payload: '{{ trigger.payload_json }}'
      overrides: {}
  - data:
      name: UCC_SENT
      message: 'Area: {{ area_key }} | Action: light_call | Value: {{ target_light
        }}'
      entity_id: sensor.ucc_registry_log
    action: logbook.log
