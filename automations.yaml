- id: '1785697644369'
  alias: UCC - Loopback Coordinator V3 (Native Scenes)
  description: Unified router for relative steering, posture-aware scene shifting,
    history tracking, and native scene execution.
  triggers:
  - trigger: event
    id: bus_event
    event_type: universal_controller_command
    event_data:
      action_type: scene_cycle
    enabled: true
  - trigger: event
    event_type: call_service
    event_data:
      domain: scene
      service: turn_on
    id: core_scene_call
  - trigger: select.selection_changed
    target:
      label_id: scene
    id: option_change
  actions:
  - variables:
      is_service_call: '{{ trigger.id == ''core_scene_call'' }}'
      is_option_change: '{{ trigger.id == ''option_change'' }}'
      called_scene_entity: "{% if is_service_call %}\n  {{ trigger.event.data.service_data.entity_id[0]
        if trigger.event.data.service_data.entity_id is list else trigger.event.data.service_data.entity_id
        }}\n{% else %}\n  none\n{% endif %}"
      payload: "{% if is_service_call %}\n\n  {% set area = area_id(called_scene_entity)
        | default('none', true) %}\n  {% set parts = called_scene_entity.split('.')[1].replace(area
        ~ '_', '').split('_') %}\n    \n  {{\n    {\n    'source_device': 'native_core_scene_call',\n
        \   'target': {'area_id': area}, \n    'action_value': parts[0] ~ ' ' ~ (parts[1:]
        | join(' ') | title)\n    }\n  }}\n{% elif is_option_change %}\n  {{\n    {\n
        \   'source_device': 'native_select_option',\n    'target': {'area_id': area_id(trigger.to_state.entity_id)},
        \n    'action_value': trigger.to_state.state\n    }\n  }}\n{% else %}\n  {{
        trigger.event.data }}\n{% endif %}"
      target_area: '{{ payload.get(''target'', {}).get(''area_id'', ''none'') }}'
      action_raw: '{{ payload.action_value | default(''next'') | string }}'
      target_select: select.{{ target_area }}_matrix_scene
      current_history: '{{ state_attr(target_select, ''history_stack'') | default([],
        true) | replace('':'','''') }}'
      options: "{% set ns = namespace(found=[]) %}\n{% set prefix = 'scene.' ~ target_area
        ~ '_' %}\n{% for s in states.scene | selectattr('entity_id', 'search', '^'
        ~ prefix ~ '[0-9]*0_') %}\n  {% set suffix = s.entity_id | replace(prefix,
        '', 1) %}\n  {% set parts = suffix.split('_') %}\n  {% set ns.found = ns.found
        + [ parts[0] ~ ' ' ~ parts[1:] | join(' ') | title ] %}\n{% endfor %}\n    \n{{
        ns.found | unique | sort }}"
      t_state: '{{ states(target_select) }}'
  - variables:
      action_resolved: "{% if action_raw in ['next', 'raise', 'select_next'] %}\n
        \ {% set idx = options.index(t_state) | default(0, true) + 1 %}\n  {{ options[idx]
        if idx < options | length else options[idx] }}\n{% elif action_raw in ['previous',
        'lower', 'select_previous'] %}\n  {% set idx = options.index(t_state) | default(1,
        true) - 1 %}\n  {{ options[idx] if idx >= 0 else options[-1] }}\n{% elif action_raw
        in ['off', 'select_first'] %}\n  {{ options[0] if options | length > 0 else
        '0 Off' }}\n{% elif action_raw in ['max', 'select_last'] %}\n  {{ options[-1]
        if options | length > 0 else '0 Off' }}\n{% elif action_raw == 'restore' %}\n
        \ {% set active_history = current_history \n     | reject('match', '^0')\n
        \    | reject('eq', '0') \n     | list %}\n  {{ active_history[-1] if active_history
        | length > 0 else (options[1] if options | length > 1 else options[0]) }}\n{%
        elif action_raw == 'min' %}\n  {{ options[1] if options | length > 1 else
        options[0] }}\n{% else %}\n  {% set by_id = options | select('match', '^'
        ~ action_raw ~ ' ') | first | default(none) %}\n  {% set by_name = options
        | select('search', action_raw) | first | default(none) %}\n  {{ by_id if by_id
        is not none else (by_name if by_name is not none else action_raw) }}\n{% endif
        %}"
      is_valid_option: '{{ action_resolved in options }}'
      parts: '{{ action_resolved.split('' '') if '' '' in action_resolved else [0,
        action_resolved] }}'
      scene_id: '{{ parts[0] | int(0) }}'
      scene_name: '{{ parts[1:] | join('' '') | default(''Off'') | title }}'
      history_update: '{{ (current_history + [action_resolved])[-5:] if action_resolved
        != current_history[-1] | default('''') else current_history }}'
  - condition: template
    value_template: '{{ is_valid_option and target_area != ''none'' }}'
  - variables:
      current_posture: '{% set registry = state_attr(''sensor.global_variable_registry'',
        ''vars'') | default({}, true) %}{% set g_logic = registry.get(''globals'',{}).get(''environmental'',{})
        %}{{ states(g_logic.get(''home_posture'', '''')) | default(''disarmed'', true)
        }}'
      posture_offset_map:
        disarmed: 0
        armed_night: 5
        armed_away: 1
      offset: '{{ posture_offset_map.get(current_posture, 0) | default(0) | int }}'
      base_id: '{{ scene_id }}'
      night_shift_id: '{{ base_id + offset }}'
      night_prefix: '{{ ''scene.'' ~ target_area ~ ''_'' ~ night_shift_id ~ ''_''
        }}'
      base_prefix: '{{ ''scene.'' ~ target_area ~ ''_'' ~ base_id ~ ''_'' }}'
      base_entity: '{{ states.scene | selectattr(''entity_id'', ''search'', ''^''
        ~ base_prefix) | map(attribute=''entity_id'') | first | default(none) }}'
      night_entity: '{{ states.scene | selectattr(''entity_id'', ''search'', ''^''
        ~ night_prefix) | map(attribute=''entity_id'') | first | default(base_entity)
        }}'
      matched_scene: '{{ night_entity if night_entity is not none else base_entity
        }}'
  - if:
    - condition: template
      value_template: '{{ not is_service_call }}'
    then:
    - action: scene.turn_on
      target:
        entity_id: '{{ matched_scene }}'
  - action: mqtt.publish
    data:
      topic: homeassistant/select/{{ target_area }}/scene/attributes
      retain: true
      payload: '{{ {''options'': options, ''scene'': {''scene_id'': base_id, ''scene_name'':
        scene_name}, ''friendly_name'': state_attr(target_select, ''friendly_name''),
        ''icon'': state_attr(target_select, ''icon''), ''history_stack'': history_update}
        | tojson }}'
  - action: mqtt.publish
    data:
      topic: homeassistant/select/{{ target_area }}/scene/state
      retain: true
      payload: '{{ {''scene_id'': base_id, ''scene_name'': scene_name} | tojson }}'
  - action: logbook.log
    data:
      name: UCC Loopback V3
      message: Resolved command '{{ action_raw }}' -> Activated native scene '{{ matched_scene
        }}' for area [{{ area_name(target_area) }}]
      entity_id: '{{ target_select }}'
  mode: parallel
  max: 20
- id: '1785843783418'
  alias: GPE - Area Context Synchronizer (V1.5)
  triggers:
  - event_type: esphome.gpe_area_request_update
    id: Switch_Request
    trigger: event
  - entity_id:
    - sensor.global_variable_registry
    id: Broadcast
    trigger: state
  conditions: []
  actions:
  - variables:
      target_area: "{% if trigger.id == 'Switch_Request' %}\n  {{ trigger.event.data.area_id
        | default('none') }}\n{% elif trigger.id == 'Broadcast' %}\n  {{ trigger.payload_json.target.area_id
        | default('none') }}\n{% else %}\n  {{ area_id(trigger.entity_id) | default('none')
        }}\n{% endif %}"
      target_device_name: "{% if trigger.id == 'Switch_Request' %}\n  {{ trigger.event.data.device_name
        | default(target_area ~ '_switch') }}\n{% else %}\n  {{ target_area ~ '_switch'
        }}\n{% endif %}"
      target_esphome_service: esphome.{{ target_device_name | replace('-', '_') }}_gpe_area_update
      profile_sensor: sensor.{{ target_area }}_profile
      profile_exists: '{{ states(profile_sensor) not in [''unknown'', ''unavailable'']
        }}'
      profile_topography: '{{ state_attr(profile_sensor, ''topography'') | default({},
        true) }}'
      profile_features: '{{ state_attr(profile_sensor, ''features'') | default({},
        true) }}'
      target_area_scene_sensor: select.{{ target_area }}_matrix_scene
      profile_scenes: '{{ state_attr(target_area_scene_sensor, ''options'') | default({},
        true) }}'
      current_history: '{{ state_attr(target_area_scene_sensor, ''history_stack'')
        | default([], true) }}'
      profile_scene_last: "{% set active_history = current_history \n     | reject('match',
        '^0')\n     | reject('eq', '0') \n     | list %}\n  {{ active_history[-1]
        if active_history | length > 0 else (profile_scenes[1] if profile_scenes |
        length > 1 else profile_scenes[0]) }}"
      parts: '{{ profile_scene_last.split('' '') if '' '' in profile_scene_last else
        [0, profile_scene_last] }}'
      scene_id: '{{ parts[0] | int(10) }}'
      scene_name: '{{ parts[1:] | join('' '') | default(''Off'') | title }}'
      profile_timeouts: '{{ state_attr(profile_sensor, ''timeouts'') | default({},
        true) }}'
      door_entities: '{{ profile_topography.get(''door_entities'', []) }}'
      door_entity: '{{ door_entities | first | default(''none'') }}'
      has_door: '{{ door_entity != ''none'' and states(door_entity) not in [''unknown'',
        ''unavailable''] }}'
      door_mqtt_topic: "{% if has_door %}\n  {{ device_name(door_entity) | default(area_name(target_area)
        ~ ' Door') }}\n{% else %}\n  none\n{% endif %}"
      root_topic: '{{ profile_topography.get(''root_topic'', ''zigbee2mqtt'') }}'
      light_topic: '{{ device_name(profile_topography.get(''light_entities'', [area_name(target_area)]
        ) | first ) }}'
      fan_topic: '{{ device_name(profile_topography.get(''fan_entities'', [area_name(target_area)
        ~ '' Fan'']) | first ) }}'
  - condition: template
    value_template: '{{ target_area != ''none'' and profile_exists }}'
  - action: '{{ target_esphome_service }}'
    data:
      area_id: '{{ target_area }}'
      root_topic: '{{ root_topic }}'
      light_topic: '{{ light_topic }}'
      fan_topic: '{{ fan_topic }}'
      door_topic: '{{ door_mqtt_topic }}'
      scene_eligible: '{{ profile_features.get(''scene_eligible'', true) }}'
      use_scene: '{{ profile_features.get(''use_scene'', true) }}'
      light_on_scene: '{{ scene_id }}'
      light_off_scene: '{{ 0 | int }}'
      light_sec: '{{ profile_timeouts.get(''light_sec'', 120) | int }}'
      fan_sec: '{{ profile_timeouts.get(''fan_sec'', 300) | int }}'
  - action: logbook.log
    data:
      message: 'GPE Context Synced -> Area: {{ target_area }} | Target Action: {{
        target_esphome_service }}'
      name: ESPHome Area Context Sync
  mode: queued
  max: 10
