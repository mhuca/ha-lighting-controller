            true) }}'
          is_bind_eligible: '{{ profile_features.get(''bind_eligible'', false) }}'
          use_scene: '{{ profile_features.get(''scene_eligible'', false) }}'
          target_light: "{{ label_entities('main') \n   | select('match', 'light\\.')\n
            \  | select('in', area_entities(target_area)) \n   | first | default('none')
            }}\n"
          intended_command: '{{ ''turn_off'' if is_state(target_light, ''on'') else
            ''turn_on'' }}'
          continue: '{{ is_bind_eligible and target_light | count > 0 }}'
          use_night_settings: "{% set registry = state_attr('sensor.global_variable_registry',
            'vars') \n   | default({}, true) %}\n{% set g_env = registry.get('globals',
            {}).get('environmental', {}) %}\n\n{{\n  profile_features.get('night_light',
            false) and is_state(g_env.night_posture_sensor, 'on') \n}}\n"
      - condition: template
        value_template: "{{ continue }}\n   "
      - if:
        - condition: template
          value_template: '{{ not use_scene }}'
        then:
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: z2m_physical_rocker
            action_type: light_call
            action_value: '{{ ''night_mode'' if use_night_settings else ''day_mode''
              }}'
            command_input: '{{ intended_command }}'
            target:
              area_id: '{{ target_area }}'
              label_id:
              - main
            data_payload: '{{ payload }}'
            metadata:
              publish_intent: '{{ ''add'' if intended_command == ''turn_on'' else
                ''remove'' }}'
              claimant_id: '{{ device_name }}'
              seconds: '{{ -1 if intended_command == ''turn_on'' else 0 }}'
              intent_type: override
            overrides: {}
        else:
        - event: universal_controller_command
          event_data:
            action_type: scene_cycle
            target:
              area_id: '{{ target_area }}'
            action_value: restore
            source_device: '{{ device_name }}'
            metadata:
              claimant_id: '{{ device_name }}'
              action: remove
              intent_type: override
      - data:
          name: UCC_SENT
          message: 'Area: {{ target_area }} | Action: light_call | Value: {{ target_light
            }}'
          entity_id: sensor.ucc_registry_log
        action: logbook.log
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 250
        enabled: false
    - conditions:
      - condition: trigger
        id:
        - Pico_Clear_id
      sequence:
      - variables:
          payload: '{{ trigger.event.data }}'
          target_area: '{{ payload.target.area_id }}'
          claimant_id: '{{ payload.metadata.claimant_id | default(payload.source_device)
            }}'
      - alias: Emit Manual Clearance to Ledger
        event: lighting_registry_update
        event_data:
          action: remove
          action_type: lighting_registry_update
          claimant_id: '{{ claimant_id }}'
          intent_type: override
          target:
            area_id: '{{ target_area }}'
          seconds: 0
          source_device: '{{ payload.source_device }}'
          metadata:
            mode: manual_clearance
            session_id: '{{ payload.metadata.session_id | default(''none'') }}'
      - action: logbook.log
        data:
          name: Lighting Override Engine
          message: 'Manual clearance event captured via Unified Gateway for Area:
            {{ target_area }}'
          entity_id: sensor.ucc_registry_log
    enabled: true
  - event: device_lock_claim
    event_data:
      device_id: '{{ device_id }}'
      isOwned: false
      owned_ts: '{{ as_timestamp(now()) }}'
  mode: parallel
  trace:
    stored_traces: 50
  max: 10
- id: '1781290383283'
  alias: UCC - Scene Vector Coordinator
  description: Parses matrix profile configuration matrices and dispatches abstract
    layout target tokens
  triggers:
  - trigger: event
    event_type: ucc_scene_vector_call
    enabled: true
  actions:
  - variables:
      target_area: '{{ trigger.event.data.area_id }}'
      scene_id: '{{ trigger.event.data.scene_id | string }}'
      scene_name: '{{ trigger.event.data.scene_name }}'
      is_zigbee_scene: '{{ trigger.event.data.is_zigbee_scene | bool(false) }}'
      source_device: '{{ trigger.event.data.source_device | default(''unknown'') }}'
      bypass_primary: '{{ source_device == ''native_core_scene_call'' }}'
      profile_sensor: sensor.{{ target_area }}_matrix_scene_config
      profiles: '{{ state_attr(profile_sensor, ''scenes'') | default({}, true) }}'
      next_scene: '{{ profiles.get(scene_id | string , none) }}'
  - condition: template
    value_template: '{{ target_area != ''none'' and (is_zigbee_scene or next_scene
      is not none) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_zigbee_scene }}'
        alias: Zigbee Scene Called
      sequence:
      - alias: Dispatch Native Hardware Scene Token
        event: universal_controller_command
        event_data:
          source_device: ucc_scene_vector_coordinator
          action_type: light_call
          target:
            area_id: '{{ target_area }}'
            scene_id: '{{ scene_id | int }}'
          action_value: ''
          command_input: turn_on
          metadata:
            mode: scene
            scene_id: '{{ scene_id }}'
            scene_name: '{{ scene_name }}'
            claimant_id: scene_engine
            action: remove
            seconds: -1
            intent_type: motion
      - alias: Log Hardware Path to Logbook
        action: logbook.log
        data:
          name: UCC Scene Vector
          message: Executed native Zigbee hardware Scene ID {{ scene_id }} for [{{
            area_name(target_area) }}]
          entity_id: select.{{ target_area }}_matrix_scene
    - conditions:
      - condition: template
        value_template: '{{ not is_zigbee_scene and next_scene is not none }}'
        alias: Regular Scene Called
      sequence:
      - alias: Iterate Over Primary Area Label Definitions
        repeat:
          count: '{{ next_scene.primary.keys() | list | length if next_scene.primary
            is mapping else 1 }}'
          sequence:
          - variables:
              is_map: '{{ next_scene.primary is mapping }}'
              label_target: '{{ [(next_scene.primary.keys() | list)[repeat.index -
                1]] if is_map else [] }}'
              brightness_val: '{{ (next_scene.primary.values() | list)[repeat.index
                - 1] if is_map else next_scene.primary | default(0) }}'
          - alias: Dispatch Primary Area Target Call
            event: universal_controller_command
            event_data:
              source_device: ucc_scene_vector_coordinator
              action_type: light_call
              target:
                area_id: '{{ target_area }}'
                label_id: '{{ label_target }}'
              action_value: '{{ brightness_val | int(0) if brightness_val != ''''
                else '''' }}'
              command_input: '{{ ''turn_off'' if brightness_val | int(0) == 0 and
                brightness_val != '''' else ''turn_on'' }}'
              metadata:
                mode: scene
                scene_id: '{{ scene_id }}'
                scene_name: '{{ scene_name }}'
                claimant_id: scene_engine
                action: remove
                seconds: 0
                intent_type: motion
      - variables:
          link_keys: '{{ next_scene.links.keys() | list if next_scene.links is mapping
            else [] }}'
      - if:
        - condition: template
          value_template: '{{ link_keys | length > 0 }}'
        then:
        - alias: Iterate Over Secondary Linked Areas
          repeat:
            for_each: '{{ link_keys }}'
            sequence:
            - variables:
                link_area: '{{ repeat.item }}'
                link_data: '{{ next_scene.links.get(repeat.item) }}'
            - alias: Iterate Over Linked Area Sub-Maps
              repeat:
                count: '{{ link_data.keys() | list | length if link_data is mapping
                  else 1 }}'
                sequence:
                - variables:
                    is_sub_map: '{{ link_data is mapping }}'
                    sub_label_target: '{{ [(link_data.keys() | list)[repeat.index
                      - 1]] if is_sub_map else [] }}'
                    sub_brightness_val: '{{ (link_data.values() | list)[repeat.index
                      - 1] if is_sub_map else link_data | default(0) }}'
                - alias: Dispatch Secondary Area Target Call
                  event: universal_controller_command
                  event_data:
                    source_device: ucc_scene_vector_coordinator_link
                    action_type: light_call
                    target:
                      area_id: '{{ link_area }}'
                      label_id: '{{ sub_label_target }}'
                    action_value: '{{ sub_brightness_val | int(0) if sub_brightness_val
                      != '''' else '''' }}'
                    command_input: '{{ ''turn_off'' if sub_brightness_val | int(0)
                      == 0 and sub_brightness_val != '''' else ''turn_on'' }}'
                    metadata:
                      mode: scene
                      scene_id: '{{ scene_id }}'
                      scene_name: '{{ scene_name }}'
                      claimant_id: scene_engine
                      action: remove
                      seconds: 0
                      intent_type: motion
      - alias: Log Profile Path to Logbook
        action: logbook.log
        data:
          name: UCC Scene Vector
          message: Parsed matrix configuration for [{{ target_area }}]. Dispatched
            layout arrays for Scene ID {{ scene_id }}.
          entity_id: select.{{ target_area }}_matrix_scene
  mode: parallel
  max: 20
  trace:
    stored_traces: 50
- id: '1782412251683'
  alias: System - Lutron Pico Registry Change Monitor
  description: Pipes Lutron device registry updates down the MQTT bus to trigger automated
    Node-RED diagnostics harvesting and database relocation
  triggers:
  - event_type: device_registry_updated
    id: device_update
    trigger: event
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.device_id is not none and \n   device_attr(trigger.event.data.device_id,
      'manufacturer') is search('Lutron') }}"
  actions:
  - variables:
      event_data: '{{ trigger.event.data }}'
      device_id: '{{ event_data.device_id }}'
      suggested_area: '{{ event_data.get(''changes'', {}).get(''suggested_area'',
        ''none'') }}'
      previous_area_name: "{{ event_data.get('changes', {}).get('area_id', \n   event_data.get('changes',
        {}).get('suggested_area', 'none')) }}"
      previous_area_id: '{{ none if previous_area_name is none else area_id(previous_area_name)
        }}'
      config_entry_id: '{{ device_attr(device_id, ''config_entries'') | first | default(''none'')
        }}'
      device_name: '{{ device_attr(device_id, ''name'') }}'
      device_model: '{{ device_attr(device_id, ''model'') }}'
      area_id: '{{ device_attr(device_id, ''area_id'') | default(''unassigned'', true)
        }}'
      serial_tuple: '{{ device_attr(device_id, ''identifiers'') | selectattr(''0'',
        ''eq'', ''lutron_caseta'') | first | default(none) }}'
      serial: '{{ serial_tuple[1] if serial_tuple is not none else ''none'' }}'
  - alias: Publish Registry Update to Node-RED Engine
    action: mqtt.publish
    data:
      topic: home/lutron/device_update
      qos: 1
      retain: false
      payload: "{{ {\n  \"action\": event_data.action,\n  \"device_id\": device_id,\n
        \ \"serial\": serial,\n  \"name\": device_name,\n  \"model\": device_model,\n
        \ \"area_id\": area_id,\n  \"previous_area_id\": previous_area_id,\n  \"previous_area_name\":
        previous_area_name,\n  \"suggested_area\": suggested_area,\n  \"config_entry_id\":
        config_entry_id,\n  \"timestamp\": as_timestamp(now()) | int\n} | to_json
        }}"
  mode: queued
  max: 10
- &id001
  id: '1782616000000'
  alias: UCC - Light Call State Verification Janitor (v2.2)
  description: '## UCC LIGHT CALL STATE VERIFICATION JANITOR (Event Driven Timeout)


    Asynchronously intercepts light calls flagged with ''use_relay''. Borrows the
    precise targeted logic from Light Call V5 to compile expected  entities, ensuring
    full-room restoration even during partial amnesic drop states.

    Waits for an event-driven confirmation that the area illuminated, timing out to
    execute a repair if an amnesic drop occurred.'
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: light_call
      metadata:
        use_relay: true
  conditions:
  - condition: template
    value_template: "{{ \n   trigger.event.data.command_input in ['turn_on', 'broadcast']
      \n}}"
  actions:
  - variables:
      target_area: '{{ trigger.event.data.target.area_id }}'
      target_labels: '{{ trigger.event.data.target.label_id | default([''main''])
        }}'
      expected_lights: "{% \n  set area_entities = area_entities(target_area) \n%}\n{%
        \n  set labeled_entities = label_entities(target_labels | first | default('main'))
        \n%} \n\n{{ area_entities \n   | select('in', labeled_entities) \n   | select('match','light\\.|switch\\.')
        \n   | list\n}}"
      area_relays: "{% set area_entities = area_entities(target_area) \n%}\n{% set
        labeled_relays = label_entities('relay') \n%}\n{{ area_entities \n   | select('in',
        labeled_relays) \n   | select('match', 'switch\\.') \n   | list }}"
  - condition: template
    value_template: '{{ expected_lights | count > 0 and area_relays | count > 0 }}'
  - wait_for_trigger:
    - trigger: template
      value_template: "{# \n  To solve the 'already on' or 'mixed environment' edge
        case, we count how \n  many of our targeted expected_lights are currently
        sitting in an 'off' state. \n  The template evaluates to TRUE the exact millisecond
        that count hits ZERO.\n#} \n\n{{ expected_lights | select('is_state', 'off')
        | list | count == 0 }}"
    timeout:
      seconds: 1
      milliseconds: 200
  - if:
    - condition: template
      value_template: '{{ wait.completed == false }}'
    then:
    - action: switch.turn_on
      target:
        entity_id: '{{ area_relays }}'
    - action: logbook.log
      data:
        name: JANITOR_TIMEOUT_REPAIR
        message: 'Verification timed out for {{ target_area }}. Targeted entities
          failed to full-clear ''off'' state.  Forced relay recovery executed on:
          {{ area_relays }}'
        entity_id: sensor.ucc_registry_log
  mode: parallel
  max: 20
